<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>선물이 도착했어요 - YangPang</title>
</head>
<body>
<main class="flex-1 py-8">
    <div class="mx-auto w-full max-w-lg px-4 text-sm" th:with="g=${v.gift}, o=${v.order}">
        <div class="rounded-3xl bg-white p-6">
            <p class="text-center text-4xl">🎁</p>
            <h1 class="mt-3 text-center text-xl font-bold" th:text="${g.recipientName} + '님, ' + ${g.senderName} + '님이 보낸 선물이에요'">선물</h1>
            <p th:if="${g.message != null}" class="mx-auto mt-3 max-w-sm rounded-2xl bg-rose-50 px-4 py-3 text-center text-rose-900"
               th:text="'“' + ${g.message} + '”'">메시지</p>
            <p class="mt-3 text-center text-xs text-gray-400">연구용 가상 쇼핑몰의 모의 선물이에요. 실제로 배송되지 않아요.</p>

            <ul class="mt-5 divide-y divide-gray-100 rounded-2xl border border-gray-100">
                <li th:each="i : ${o.items}" class="flex items-center gap-3 p-3">
                    <img th:src="${i.imageUrl}" alt="" class="h-14 w-14 rounded object-cover">
                    <div class="min-w-0 flex-1">
                        <p class="line-clamp-2" th:text="${i.productName}">상품</p>
                        <p class="text-xs text-gray-500"><span th:if="${i.optionText != null}" th:text="${i.optionText} + ' · '"></span><span th:text="${i.quantity} + '개'">1개</span></p>
                        <p th:if="${!v.acceptable() and !v.canceled() and !v.unpaid()}" class="mt-0.5 text-xs font-semibold text-arrival"
                           th:text="${i.status.label()} + (${i.status.step() >= 1 and i.status.step() < 5} ? ' · ' + ${@fmt.day(i.promisedDate)} + ' 도착 예정' : '')">상태</p>
                    </div>
                </li>
            </ul>

            <!-- 취소·만료 -->
            <div th:if="${v.canceled()}" class="mt-5 rounded-2xl bg-gray-100 p-4 text-center text-gray-600">
                <p class="font-bold" th:text="${g.status.name() == 'EXPIRED'} ? '배송지 입력 기한이 지나 선물이 취소되었어요' : '보내는 분이 선물을 취소했어요'">취소</p>
            </div>

            <!-- 결제 전 -->
            <div th:if="${v.unpaid()}" class="mt-5 rounded-2xl bg-yellow-50 p-4 text-center text-yellow-800">
                보내는 분의 결제가 끝나면 배송지를 입력할 수 있어요.
            </div>

            <!-- 받은 뒤 -->
            <div th:if="${!v.acceptable() and !v.canceled() and !v.unpaid()}" class="mt-5 rounded-2xl bg-emerald-50 p-4 text-emerald-800">
                <p class="font-bold">배송지를 받았어요</p>
                <p class="mt-1" th:text="'(' + ${o.zipcode} + ') ' + ${o.address1} + ' ' + ${o.address2 ?: ''}">주소</p>
            </div>

            <!-- 배송지 입력 -->
            <form th:if="${v.acceptable()}" th:action="@{/gift/{t}(t=${g.token})}" method="post" class="mt-5 space-y-3">
                <p class="font-bold">선물 받을 주소를 알려 주세요</p>
                <p class="text-xs text-gray-500" th:text="${@fmt.dateTime(g.expiresAt)} + '까지 입력하지 않으면 선물이 자동으로 취소돼요. 입력한 주소는 보내는 분께 보여 주지 않아요.'">기한</p>
                <label class="block"><span class="mb-1 block font-semibold">우편번호</span>
                    <input name="zipcode" required pattern="\d{5}" maxlength="5" inputmode="numeric" class="input" placeholder="06236"></label>
                <label class="block"><span class="mb-1 block font-semibold">주소</span>
                    <input name="address1" required maxlength="200" class="input" placeholder="서울 강남구 테헤란로 123"></label>
                <label class="block"><span class="mb-1 block font-semibold">상세 주소</span>
                    <input name="address2" maxlength="200" class="input" placeholder="101동 1001호"></label>
                <label class="block"><span class="mb-1 block font-semibold">공동현관 출입</span>
                    <select name="entranceType" class="input">
                        <option th:each="e : ${entranceTypes}" th:value="${e.name()}" th:text="${e.label()}">자유출입</option>
                    </select></label>
                <label class="block"><span class="mb-1 block font-semibold">출입 방법 메모 <span class="font-normal text-gray-400">(선택)</span></span>
                    <input name="entranceNote" maxlength="100" class="input" placeholder="공동현관 비밀번호 등"></label>
                <label class="block"><span class="mb-1 block font-semibold">배송 요청사항 <span class="font-normal text-gray-400">(선택)</span></span>
                    <input name="requestNote" maxlength="100" class="input" value="문 앞에 놓아주세요"></label>
                <button class="btn-primary h-12 w-full text-base">이 주소로 선물 받기</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
