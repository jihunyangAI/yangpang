<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>장바구니 - YangPang</title>
</head>
<body>
<main class="flex-1 pb-36 md:pb-0">
<div class="container-page py-4 md:py-8">
<h1 class="mb-5 text-2xl font-bold md:mb-6 md:text-[32px]">장바구니</h1>

<!-- htmx가 변경 요청 후 이 영역을 통째로 바꿔 끼운다 -->
<div id="cart" th:fragment="cart" class="md:flex md:items-start md:gap-8">

    <!-- 빈 장바구니 -->
    <div th:if="${cart.isEmpty()}" class="card w-full px-4 py-20 text-center">
        <svg class="mx-auto h-11 w-11 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11h11l2-8H6.2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
        <p class="mt-3 font-serif text-lg font-bold">장바구니에 담긴 상품이 없어요</p>
        <a th:href="@{/}" class="btn-primary mt-5">쇼핑 계속하기</a>
    </div>

    <th:block th:unless="${cart.isEmpty()}">
    <section class="min-w-0 flex-1 space-y-5">

        <!-- 전체 선택 / 선택 삭제 -->
        <div class="flex items-center justify-between px-1 text-sm">
            <label class="flex items-center gap-2 font-bold">
                <input type="checkbox" name="selected" value="true" class="h-5 w-5 accent-brand-600"
                       th:checked="${cart.allSelected}"
                       hx-post="/cart/select-all" hx-trigger="change" hx-target="#cart" hx-swap="outerHTML">
                전체선택 (<span th:text="${cart.selectedCount}">0</span>)
            </label>
            <button type="button" class="rounded-full bg-white px-3.5 py-1.5 text-xs text-gray-700 ring-1 ring-gray-200 hover:ring-gray-300"
                    hx-post="/cart/delete-selected" hx-target="#cart" hx-swap="outerHTML"
                    hx-confirm="선택한 상품을 삭제할까요?">선택삭제</button>
        </div>

        <!-- 배송 묶음 -->
        <div th:each="g : ${cart.groups}" class="card overflow-hidden px-5 md:px-6">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-gray-100 py-4">
                <p class="text-base font-bold text-sea-600" th:text="${g.label}">양팡배송 상품</p>
                <p class="text-xs" th:switch="true">
                    <span th:case="${g.amount == 0}" class="text-gray-400">선택한 상품 없음</span>
                    <span th:case="${g.fee == 0}" class="font-semibold text-arrival">무료배송</span>
                    <span th:case="${g.remainingForFree > 0}" class="text-gray-700">
                        <b class="text-brand-600" th:text="${#numbers.formatInteger(g.remainingForFree, 1, 'COMMA')} + '원'">0원</b>
                        더 담으면 무료배송 · 배송비 <span th:text="${#numbers.formatInteger(g.fee, 1, 'COMMA')} + '원'">3,000원</span>
                    </span>
                    <span th:case="*" class="text-gray-700" th:text="'배송비 ' + ${#numbers.formatInteger(g.fee, 1, 'COMMA')} + '원'">배송비</span>
                </p>
            </div>

            <ul class="divide-y divide-gray-100">
                <li th:each="l : ${g.lines}" class="flex gap-3 py-5 md:gap-4">
                    <input type="checkbox" name="selected" value="true" class="mt-1 h-5 w-5 shrink-0 accent-brand-600"
                           th:checked="${l.selected}" th:attr="hx-post=@{/cart/{id}/select(id=${l.cartItemId})}"
                           hx-trigger="change" hx-target="#cart" hx-swap="outerHTML" aria-label="선택">
                    <a th:href="@{/products/{id}(id=${l.productId}, item=${l.itemId})}" class="h-20 w-20 shrink-0 overflow-hidden rounded-2xl bg-gray-100 md:h-[88px] md:w-[88px]">
                        <img th:src="${l.imageUrl}" alt="" class="h-full w-full object-cover">
                    </a>
                    <div class="min-w-0 flex-1">
                        <a th:href="@{/products/{id}(id=${l.productId}, item=${l.itemId})}" class="line-clamp-2 text-sm hover:underline md:text-[15px]" th:text="${l.productName}">상품명</a>
                        <p th:if="${l.optionText != null}" class="mt-0.5 text-xs text-gray-500" th:text="${l.optionText}">옵션</p>
                        <p class="mt-1 text-xs font-semibold text-arrival" th:text="${g.arrivalText}">내일 도착</p>
                        <p th:if="${l.stock <= 10}" class="text-xs text-brand-600" th:text="'재고 ' + ${l.stock} + '개 남음'"></p>

                        <div class="mt-2 flex flex-wrap items-center justify-between gap-2">
                            <!-- 수량 -->
                            <div class="flex h-9 items-center rounded-full border border-gray-200 bg-white text-sm">
                                <button type="button" class="h-full w-8 text-gray-600 disabled:text-gray-300" th:disabled="${l.quantity <= 1}"
                                        th:attr="hx-post=@{/cart/{id}/quantity(id=${l.cartItemId})},hx-vals=|{&quot;quantity&quot;: ${l.quantity - 1}}|"
                                        hx-target="#cart" hx-swap="outerHTML" aria-label="수량 줄이기">−</button>
                                <span class="w-7 text-center font-bold leading-9" th:text="${l.quantity}">1</span>
                                <button type="button" class="h-full w-8 text-gray-600 disabled:text-gray-300" th:disabled="${l.quantity >= l.maxQuantity}"
                                        th:attr="hx-post=@{/cart/{id}/quantity(id=${l.cartItemId})},hx-vals=|{&quot;quantity&quot;: ${l.quantity + 1}}|"
                                        hx-target="#cart" hx-swap="outerHTML" aria-label="수량 늘리기">+</button>
                            </div>
                            <div class="text-right">
                                <del th:if="${l.hasDiscount()}" class="block text-xs text-gray-400"
                                     th:text="${#numbers.formatInteger(l.listPrice * l.quantity, 1, 'COMMA')} + '원'">정가</del>
                                <b class="text-base" th:text="${#numbers.formatInteger(l.lineAmount, 1, 'COMMA')} + '원'">0원</b>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="self-start text-lg text-gray-400 hover:text-gray-700" aria-label="삭제"
                            th:attr="hx-post=@{/cart/{id}/delete(id=${l.cartItemId})}" hx-target="#cart" hx-swap="outerHTML">×</button>
                </li>
            </ul>
            <!-- 무료배송까지 진행 막대 -->
            <div th:if="${g.amount > 0 and g.remainingForFree > 0}" class="border-t border-gray-100 pb-5 pt-4" aria-hidden="true">
                <div class="h-1.5 overflow-hidden rounded-full bg-gray-100">
                    <div class="h-full rounded-full bg-sea-600" th:style="'width:' + ${g.amount * 100 / (g.amount + g.remainingForFree)} + '%'"></div>
                </div>
            </div>
        </div>

        <!-- 품절·판매중지 -->
        <div th:if="${!#lists.isEmpty(cart.unavailable)}" class="card px-5 md:px-6">
            <div class="flex items-center justify-between border-b border-gray-100 py-4">
                <p class="font-bold text-gray-500">구매할 수 없는 상품 <span th:text="${#lists.size(cart.unavailable)}">0</span></p>
                <button type="button" class="text-sm text-gray-500 hover:text-gray-900"
                        hx-post="/cart/delete-unavailable" hx-target="#cart" hx-swap="outerHTML">모두 삭제</button>
            </div>
            <ul class="divide-y divide-gray-100">
                <li th:each="l : ${cart.unavailable}" class="flex gap-3 py-3 opacity-60">
                    <img th:src="${l.imageUrl}" alt="" class="h-14 w-14 rounded-xl object-cover">
                    <div class="min-w-0 flex-1 text-sm">
                        <p class="line-clamp-1" th:text="${l.productName}">상품명</p>
                        <p class="text-xs font-semibold text-gray-500">일시품절</p>
                    </div>
                </li>
            </ul>
        </div>
    </section>

    <!-- 결제 예정 금액 (PC: 오른쪽 고정, 모바일: 하단 고정 바) -->
    <aside class="mt-5 md:sticky md:top-44 md:mt-0 md:w-[360px]">
        <div class="rounded-[28px] bg-white p-6 text-[15px] md:p-7">
            <h2 class="mb-4 text-xl font-bold">결제 예정 금액</h2>
            <dl class="space-y-3">
                <div class="flex justify-between"><dt class="text-gray-500">상품금액</dt>
                    <dd th:text="${#numbers.formatInteger(cart.listAmount, 1, 'COMMA')} + '원'">0원</dd></div>
                <div class="flex justify-between"><dt class="text-gray-500">상품할인</dt>
                    <dd class="text-brand-600" th:text="'-' + ${#numbers.formatInteger(cart.productDiscount(), 1, 'COMMA')} + '원'">0원</dd></div>
                <div class="flex justify-between"><dt class="text-gray-500">배송비</dt>
                    <dd th:text="${cart.shippingFee == 0} ? '무료' : '+' + ${#numbers.formatInteger(cart.shippingFee, 1, 'COMMA')} + '원'">0원</dd></div>
            </dl>
            <div class="mt-4 flex items-baseline justify-between border-t border-gray-200 pt-4">
                <span class="font-bold">총 결제 예정</span>
                <span class="text-[26px] font-bold" th:text="${#numbers.formatInteger(cart.totalAmount, 1, 'COMMA')} + '원'">0원</span>
            </div>
            <form th:unless="${cart.guest}" th:action="@{/checkout}" method="post" class="mt-4 hidden md:block">
                <button type="submit" class="btn-primary h-14 w-full text-[17px] disabled:opacity-50" th:disabled="${cart.selectedCount == 0}"
                        th:text="${cart.selectedCount} + '개 주문하기'">구매하기</button>
            </form>
            <div th:if="${cart.guest}" class="mt-4 hidden md:block">
                <a th:href="@{/login(continue='/cart')}" class="btn-primary h-14 w-full text-[17px]">로그인하고 주문하기</a>
                <p class="mt-2 text-center text-xs text-gray-500">로그인하면 담은 상품이 내 장바구니로 합쳐져요</p>
            </div>
        </div>
    </aside>

    <div class="fixed inset-x-0 bottom-0 z-30 border-t border-gray-200 bg-white px-4 pb-5 pt-3 md:hidden">
        <form th:unless="${cart.guest}" th:action="@{/checkout}" method="post">
            <button type="submit" class="btn-primary h-12 w-full text-base disabled:opacity-50" th:disabled="${cart.selectedCount == 0}"
                    th:text="${#numbers.formatInteger(cart.totalAmount, 1, 'COMMA')} + '원 · ' + ${cart.selectedCount} + '개 주문하기'">구매하기</button>
        </form>
        <a th:if="${cart.guest}" th:href="@{/login(continue='/cart')}" class="btn-primary h-12 w-full text-base">로그인하고 구매하기</a>
    </div>
    </th:block>
</div>
</div>
</main>
</body>
</html>
