<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>1:1 문의 - YangPang</title></head>
<body>
<main class="flex-1">
    <div class="mx-auto w-full max-w-2xl px-4 py-6 text-sm md:py-8">
        <a th:href="@{/cs/inquiries}" class="text-xs text-gray-500 hover:underline">‹ 1:1 문의 내역</a>
        <div class="mt-2 rounded-3xl bg-white p-5">
            <p class="text-xs text-gray-500">
                <span class="badge" th:classappend="${i.answered()} ? 'bg-emerald-50 text-emerald-700' : 'bg-yellow-100 text-yellow-800'"
                      th:text="${i.answered()} ? '답변 완료' : '답변 대기'">상태</span>
                <span th:text="${i.category.label()} + ' · ' + ${@fmt.dateTime(i.createdAt)}">정보</span>
                <a th:if="${i.orderNo != null}" th:href="@{/my/orders/{no}(no=${i.orderNo})}" class="ml-1 font-mono underline" th:text="${i.orderNo}"></a></p>
            <h1 class="mt-2 text-lg font-bold" th:text="${i.title}">제목</h1>
            <p class="mt-2 whitespace-pre-line text-gray-700" th:text="${i.content}">내용</p>
        </div>
        <div th:if="${i.answered()}" class="mt-3 rounded-3xl bg-sea-50 p-5">
            <p class="font-bold text-sea-700">YangPang 고객센터 답변 <span class="font-normal text-gray-500" th:text="'· ' + ${@fmt.dateTime(i.answeredAt)}"></span></p>
            <p class="mt-2 whitespace-pre-line text-gray-800" th:text="${i.answer}">답변</p>
        </div>
        <p th:unless="${i.answered()}" class="mt-3 rounded-3xl bg-gray-50 p-5 text-gray-500">운영자가 확인하고 있어요. 답변이 달리면 알림함으로 알려 드려요.</p>
    </div>
</main>
</body>
</html>
