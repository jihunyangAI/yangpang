<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>쿠폰존 - YangPang</title>
</head>
<body>
<main class="flex-1">
    <div class="container-page py-6 md:py-10">
        <h1 class="text-2xl font-black">쿠폰존</h1>
        <p class="mt-1 text-sm text-gray-500">받은 쿠폰은 주문서에서 가장 유리하게 자동 적용돼요. (연구용 데모: 모든 할인은 모의 결제에만 반영)</p>
        <div class="mt-6 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
            <th:block th:each="c : ${coupons}"><div th:replace="~{coupon/zone :: card(${c})}"></div></th:block>
        </div>
        <p th:if="${#lists.isEmpty(coupons)}" class="mt-6 rounded-3xl bg-white p-10 text-center text-gray-500">지금 받을 수 있는 쿠폰이 없어요</p>
    </div>
</main>

<!-- 쿠폰 카드 (쿠폰존·상품 상세 공용) -->
<div th:fragment="card(c)" class="flex overflow-hidden rounded-lg border border-gray-200 bg-white text-sm">
    <div class="flex w-28 shrink-0 flex-col items-center justify-center bg-brand-600 px-2 text-white">
        <p class="text-lg font-black" th:text="${c.benefitText()}">10%</p>
        <p class="text-[11px] opacity-90" th:text="${c.kind.name() == 'CART'} ? '장바구니 쿠폰' : '상품 쿠폰'"></p>
    </div>
    <div class="min-w-0 flex-1 p-3">
        <p class="font-bold" th:text="${c.name}">쿠폰</p>
        <p class="text-xs text-gray-500">
            <span th:if="${c.minOrderAmount > 0}" th:text="${#numbers.formatInteger(c.minOrderAmount, 1, 'COMMA')} + '원 이상 · '"></span>
            <span th:text="'받은 날부터 ' + ${c.validDays} + '일'"></span>
            <span th:if="${c.totalQuantity != null}" th:text="' · 남은 수량 ' + ${c.totalQuantity - c.issuedCount}"></span>
        </p>
        <div class="mt-2">
            <span th:if="${owned.contains(c.id)}" class="text-xs font-bold text-gray-400">✓ 받은 쿠폰</span>
            <button th:unless="${owned.contains(c.id)}" type="button" class="rounded border border-brand-600 px-3 py-1 text-xs font-bold text-brand-700 hover:bg-brand-50"
                    th:attr="hx-post=@{/coupons/{id}/download(id=${c.id})}" hx-swap="outerHTML">쿠폰 받기 ↓</button>
        </div>
    </div>
</div>

<span th:fragment="downloaded" class="text-xs font-bold text-arrival">✓ 받았어요</span>

<!-- 상품 상세의 쿠폰 목록 -->
<div th:fragment="productCoupons" class="space-y-2">
    <th:block th:each="c : ${coupons}"><div th:replace="~{coupon/zone :: card(${c})}"></div></th:block>
    <p th:if="${#lists.isEmpty(coupons)}" class="text-xs text-gray-500">이 상품에 받을 수 있는 쿠폰이 없어요</p>
</div>
</body>
</html>
