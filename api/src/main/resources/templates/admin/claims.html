<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, ~{::main}, 'claims')}">
<head><title>취소·반품·교환 - YangPang 관리자</title></head>
<body>
<main>
    <div class="mb-4 flex flex-wrap items-center justify-between gap-2">
        <h1 class="text-xl font-bold">취소·반품·교환 <span class="text-base font-normal text-gray-500" th:text="${claims.totalElements} + '건'"></span></h1>
        <div class="flex gap-2 text-sm">
            <a th:href="@{/admin/claims}" class="rounded px-3 py-1.5" th:classappend="${!all} ? 'bg-gray-900 text-white' : 'bg-white'">진행 중</a>
            <a th:href="@{/admin/claims(all=true)}" class="rounded px-3 py-1.5" th:classappend="${all} ? 'bg-gray-900 text-white' : 'bg-white'">전체</a>
        </div>
    </div>
    <div class="overflow-x-auto rounded-lg bg-white">
        <table class="w-full min-w-[860px] text-left">
            <thead class="border-b border-gray-200 bg-gray-50 text-xs text-gray-500">
            <tr><th class="px-4 py-2">신청번호</th><th class="px-4 py-2">유형</th><th class="px-4 py-2">주문</th><th class="px-4 py-2">상품</th>
                <th class="px-4 py-2">사유</th><th class="px-4 py-2 text-right">환불</th><th class="px-4 py-2">상태</th><th></th></tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
            <tr th:each="c : ${claims.content}">
                <td class="px-4 py-2 font-mono text-xs" th:text="${c.claimNo}"></td>
                <td class="px-4 py-2" th:text="${c.type.label()}"></td>
                <td class="px-4 py-2"><a th:href="@{/admin/orders/{no}(no=${orderNos[c.id]})}" class="font-mono text-xs text-brand-700 hover:underline" th:text="${orderNos[c.id]}"></a></td>
                <td class="max-w-[220px] truncate px-4 py-2" th:text="${c.items[0].orderItem.productName} + (${#lists.size(c.items) > 1} ? ' 외 ' + ${#lists.size(c.items) - 1} : '')"></td>
                <td class="px-4 py-2" th:text="${c.reason.label()} + ' (' + (${c.fault.name() == 'SELLER'} ? '판매자' : '고객') + ')'"></td>
                <td class="px-4 py-2 text-right" th:text="${#numbers.formatInteger(c.refundAmount, 1, 'COMMA')}"></td>
                <td class="px-4 py-2"><span class="badge bg-brand-50 text-brand-700" th:text="${c.status.label()}"></span></td>
                <td class="px-4 py-2 text-right">
                    <form th:if="${c.type.name() != 'CANCEL' and (c.status.name() == 'REQUESTED' or c.status.name() == 'PICKING_UP' or c.status.name() == 'PICKED_UP')}"
                          th:action="@{/admin/claims/{no}/advance(no=${c.claimNo})}" method="post">
                        <button class="text-xs text-brand-700 hover:underline">다음 단계 ›</button></form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <p th:if="${claims.isEmpty()}" class="mt-4 text-center text-gray-500">해당하는 신청이 없어요</p>
</main>
</body>
</html>
