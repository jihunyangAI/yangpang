<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, ~{::main}, 'exhibitions')}">
<head><title>기획전 상품 - YangPang 관리자</title></head>
<body>
<main>
    <p class="text-xs text-gray-500"><a th:href="@{/admin/exhibitions}" class="hover:underline">기획전</a> ›</p>
    <div class="mb-4 flex flex-wrap items-center justify-between gap-2">
        <h1 class="text-xl font-bold" th:text="${e.title}">기획전</h1>
        <a th:if="${e.isLive(now)}" th:href="@{/events/{s}(s=${e.slug})}" target="_blank" class="btn-outline bg-white">고객 화면 ›</a>
    </div>
    <form th:action="@{/admin/exhibitions/{id}/products(id=${e.id})}" method="post" class="mb-6 flex flex-wrap items-end gap-2 rounded-lg bg-white p-4">
        <label><span class="mb-1 block text-xs text-gray-500">구역 이름</span><input name="section" required maxlength="50" class="input w-40" placeholder="텐트·타프"></label>
        <label class="min-w-64 flex-1"><span class="mb-1 block text-xs text-gray-500">상품 번호 (쉼표·공백 구분)</span><input name="productIds" required class="input" placeholder="12, 45, 78"></label>
        <button class="btn-primary">추가</button>
    </form>
    <div class="overflow-x-auto rounded-lg bg-white">
        <table class="w-full min-w-[640px] text-left">
            <thead class="border-b border-gray-200 bg-gray-50 text-xs text-gray-500">
            <tr><th class="px-3 py-2">구역</th><th class="px-3 py-2">상품</th><th class="px-3 py-2 text-right">대표가</th><th class="px-3 py-2">상태</th><th></th></tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
            <tr th:each="r : ${rows}">
                <td class="px-3 py-2 text-xs font-bold" th:text="${r.section}"></td>
                <td class="px-3 py-2"><span class="text-gray-400" th:text="'#' + ${r.id}"></span> <span th:text="${r.name}"></span></td>
                <td class="px-3 py-2 text-right" th:text="${r.rep_sale_price == null} ? '-' : ${#numbers.formatInteger(r.rep_sale_price, 1, 'COMMA')}"></td>
                <td class="px-3 py-2 text-xs" th:text="${r.status} + (${r.sold_out} ? ' · 품절' : '')"></td>
                <td class="px-3 py-2 text-right">
                    <form th:action="@{/admin/exhibitions/{id}/products/{p}/delete(id=${e.id}, p=${r.id})}" method="post">
                        <button class="text-xs text-gray-500 underline">빼기</button></form></td>
            </tr>
            </tbody>
        </table>
        <p th:if="${#lists.isEmpty(rows)}" class="p-8 text-center text-gray-400">아직 상품이 없어요</p>
    </div>
</main>
</body>
</html>
