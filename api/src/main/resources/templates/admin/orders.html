<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, ~{::main}, 'orders')}">
<head><title>주문 관리 - YangPang 관리자</title></head>
<body>
<main>
    <h1 class="mb-4 text-xl font-bold">주문 관리 <span class="text-base font-normal text-gray-500" th:text="${orders.totalElements} + '건'">0건</span></h1>
    <form th:action="@{/admin/orders}" method="get" class="mb-4 flex flex-wrap gap-2">
        <select name="status" class="input w-auto bg-white">
            <option th:each="s : ${statusFilters}" th:value="${s}" th:text="${s.label}" th:selected="${s == status}">상태</option>
        </select>
        <input name="q" th:value="${q}" placeholder="주문번호·받는 분" class="input max-w-xs bg-white">
        <button class="btn-outline">검색</button>
    </form>
    <div class="overflow-x-auto rounded-lg bg-white">
        <table class="w-full min-w-[760px] text-left">
            <thead class="border-b border-gray-200 bg-gray-50 text-xs text-gray-500">
            <tr><th class="px-4 py-2">주문번호</th><th class="px-4 py-2">주문일시</th><th class="px-4 py-2">상품</th>
                <th class="px-4 py-2">받는 분</th><th class="px-4 py-2 text-right">결제금액</th><th class="px-4 py-2">상태</th></tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
            <tr th:each="o : ${orders.content}" class="hover:bg-gray-50">
                <td class="px-4 py-2"><a th:href="@{/admin/orders/{no}(no=${o.orderNo})}" class="font-mono text-brand-700 hover:underline" th:text="${o.orderNo}">번호</a></td>
                <td class="px-4 py-2 text-gray-600" th:text="${@fmt.dateTime(o.orderedAt)}">일시</td>
                <td class="max-w-xs truncate px-4 py-2" th:text="${o.title()}">상품</td>
                <td class="px-4 py-2" th:text="${o.recipient}">받는 분</td>
                <td class="px-4 py-2 text-right" th:text="${#numbers.formatInteger(o.paidAmount, 1, 'COMMA')} + '원'">0원</td>
                <td class="px-4 py-2"><span class="badge"
                    th:classappend="${o.status.step() < 0} ? 'bg-gray-100 text-gray-500' : (${o.status.step() == 0} ? 'bg-yellow-50 text-yellow-700' : 'bg-brand-50 text-brand-700')"
                    th:text="${o.status.label()}">상태</span></td>
            </tr>
            </tbody>
        </table>
    </div>
    <nav th:if="${orders.totalPages > 1}" class="mt-4 flex flex-wrap gap-1">
        <a th:each="n : ${pageNumbers}"
           th:href="@{/admin/orders(status=${status}, q=${q}, page=${n})}" th:text="${n}"
           class="min-w-8 rounded px-2.5 py-1.5 text-center"
           th:classappend="${n == orders.number + 1} ? 'bg-gray-900 text-white' : 'bg-white hover:bg-gray-50'">1</a>
    </nav>
</main>
</body>
</html>
