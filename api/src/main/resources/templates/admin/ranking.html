<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, ~{::main}, 'ranking')}">
<head><title>양팡 랭킹 - YangPang 관리자</title></head>
<body>
<main>
    <div class="mb-4 flex flex-wrap items-center justify-between gap-2">
        <h1 class="text-xl font-bold">양팡 랭킹 가중치</h1>
        <div class="flex gap-2">
            <a th:href="@{/ranking}" target="_blank" class="btn-outline bg-white">고객 화면 ›</a>
            <form th:action="@{/admin/ranking/recompute}" method="post"><button class="btn-outline bg-white">지금 다시 계산</button></form>
        </div>
    </div>
    <p class="mb-4 text-xs text-gray-500">각 지표를 판매 중인 상품 전체에서 백분위(0~100)로 바꾼 뒤 가중치만큼 더해 점수를 냅니다.
        가중치는 비율로만 쓰이므로 합계가 100이 아니어도 됩니다. 10분마다 자동으로 다시 계산되고, 저장하면 바로 반영돼요.
        "양팡 랭킹순" 정렬과 검색 결과(관련도가 같을 때)에 쓰입니다.</p>

    <form th:action="@{/admin/ranking}" method="post" class="mb-6 rounded-lg bg-white p-4">
        <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
            <label th:each="w : ${weights}" class="block rounded border border-gray-100 p-3">
                <span class="flex items-center justify-between"><b th:text="${w.label}">지표</b>
                    <span class="text-xs text-gray-400" th:text="${total > 0} ? ${#numbers.formatDecimal(100.0 * w.weight / total, 1, 0)} + '%' : '-'"></span></span>
                <input type="number" min="0" max="100" th:name="'w_' + ${w.factor}" th:value="${w.weight}" class="input mt-2">
                <span class="mt-1 block text-xs text-gray-500" th:text="${w.description}"></span>
            </label>
        </div>
        <button class="btn-primary mt-4">저장하고 다시 계산</button>
    </form>

    <div class="overflow-x-auto rounded-lg bg-white">
        <p class="border-b border-gray-100 px-4 py-3 font-bold">현재 상위 20개 <span class="font-normal text-gray-400">(지표별 백분위)</span></p>
        <table class="w-full min-w-[900px] text-left">
            <thead class="border-b border-gray-200 bg-gray-50 text-xs text-gray-500">
            <tr><th class="px-3 py-2">순위</th><th class="px-3 py-2">상품</th><th class="px-3 py-2 text-right">점수</th>
                <th th:each="w : ${weights}" class="px-2 py-2 text-right" th:text="${w.label}"></th></tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
            <tr th:each="t, st : ${top}">
                <td class="px-3 py-2 font-bold" th:text="${st.count}">1</td>
                <td class="max-w-xs px-3 py-2"><a th:href="@{/products/{id}(id=${t.productId})}" target="_blank" class="line-clamp-1 hover:underline" th:text="${t.name}"></a></td>
                <td class="px-3 py-2 text-right font-bold" th:text="${#numbers.formatDecimal(t.score, 1, 1)}"></td>
                <td th:each="w : ${weights}" class="px-2 py-2 text-right text-xs" th:with="v=${t.factors.get(w.factor)}"
                    th:classappend="${v >= 80} ? 'font-bold text-brand-700' : (${v < 30} ? 'text-gray-400')" th:text="${#numbers.formatDecimal(v, 1, 0)}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
