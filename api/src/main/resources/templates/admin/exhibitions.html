<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, ~{::main}, 'exhibitions')}">
<head><title>기획전 - YangPang 관리자</title></head>
<body>
<main>
    <div class="mb-4 flex items-center justify-between">
        <h1 class="text-xl font-bold">기획전</h1>
        <a th:href="@{/events}" target="_blank" class="btn-outline bg-white">고객 화면 ›</a>
    </div>
    <form th:action="@{/admin/exhibitions}" method="post" class="mb-6 grid gap-3 rounded-lg bg-white p-4 md:grid-cols-4">
        <label class="md:col-span-2"><span class="mb-1 block text-xs text-gray-500">제목</span><input name="title" required maxlength="100" class="input"></label>
        <label><span class="mb-1 block text-xs text-gray-500">주소 이름 (/events/…)</span><input name="slug" required class="input" placeholder="winter-sale"></label>
        <label><span class="mb-1 block text-xs text-gray-500">색상</span>
            <select name="theme" class="input"><option th:each="t : ${themes}" th:value="${t}" th:text="${t.label()}"></option></select></label>
        <label class="md:col-span-2"><span class="mb-1 block text-xs text-gray-500">부제</span><input name="subtitle" maxlength="200" class="input"></label>
        <label><span class="mb-1 block text-xs text-gray-500">시작일</span><input name="startsOn" type="date" required th:value="${today}" class="input"></label>
        <label><span class="mb-1 block text-xs text-gray-500">종료일</span><input name="endsOn" type="date" required th:value="${today.plusDays(14)}" class="input"></label>
        <label class="md:col-span-2"><span class="mb-1 block text-xs text-gray-500">전용 쿠폰 (선택)</span>
            <select name="couponId" class="input"><option value="">없음</option>
                <option th:each="c : ${coupons}" th:value="${c.id}" th:text="${c.name}"></option></select></label>
        <label><span class="mb-1 block text-xs text-gray-500">순서</span><input name="sortOrder" type="number" value="10" class="input"></label>
        <div class="flex items-end"><button class="btn-primary w-full">기획전 만들기</button></div>
    </form>
    <div class="overflow-x-auto rounded-lg bg-white">
        <table class="w-full min-w-[760px] text-left">
            <thead class="border-b border-gray-200 bg-gray-50 text-xs text-gray-500">
            <tr><th class="px-3 py-2">제목</th><th class="px-3 py-2">기간</th><th class="px-3 py-2 text-right">상품</th><th class="px-3 py-2">쿠폰</th><th class="px-3 py-2">상태</th></tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
            <tr th:each="e : ${exhibitions}">
                <td class="px-3 py-2"><a th:href="@{/admin/exhibitions/{id}(id=${e.id})}" class="font-medium text-brand-700 hover:underline" th:text="${e.title}"></a>
                    <span class="block text-xs text-gray-400" th:text="'/events/' + ${e.slug}"></span></td>
                <td class="px-3 py-2 text-xs" th:text="${@fmt.date(e.startsAt)} + ' ~ ' + ${@fmt.date(e.endsAt)}"></td>
                <td class="px-3 py-2 text-right" th:text="${counts.getOrDefault(e.id, 0L)}"></td>
                <td class="px-3 py-2 text-xs" th:text="${e.couponId != null} ? '있음' : '-'"></td>
                <td class="px-3 py-2">
                    <span class="badge" th:classappend="${e.isLive(now)} ? 'bg-brand-50 text-brand-700' : 'bg-gray-100 text-gray-500'"
                          th:text="${e.isLive(now)} ? '노출 중' : (${e.active} ? '기간 외' : '숨김')"></span>
                    <form th:action="@{/admin/exhibitions/{id}/toggle(id=${e.id})}" method="post" class="inline">
                        <button class="ml-1 text-xs text-gray-500 underline" th:text="${e.active} ? '숨기기' : '보이기'"></button></form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
