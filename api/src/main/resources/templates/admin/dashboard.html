<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, ~{::main}, 'dashboard')}">
<head><title>대시보드 - YangPang 관리자</title></head>
<body>
<main>
    <h1 class="mb-6 text-xl font-bold">대시보드</h1>
    <div class="grid grid-cols-2 gap-4 lg:grid-cols-3">
        <div class="rounded-lg bg-white p-5"><p class="text-gray-500">오늘 주문</p>
            <p class="mt-1 text-3xl font-extrabold" th:text="${#numbers.formatInteger(ordersToday, 1, 'COMMA')}">0</p></div>
        <div class="rounded-lg bg-white p-5"><p class="text-gray-500">오늘 결제금액</p>
            <p class="mt-1 text-3xl font-extrabold" th:text="${#numbers.formatInteger(salesToday, 1, 'COMMA')} + '원'">0</p></div>
        <a th:href="@{/admin/orders(status='ONGOING')}" class="rounded-lg bg-white p-5 hover:ring-2 hover:ring-brand-500"><p class="text-gray-500">입금대기 / 출고대기</p>
            <p class="mt-1 text-3xl font-extrabold"><span th:text="${pendingPayments}">0</span> / <span th:text="${toShip}">0</span></p></a>
        <div class="rounded-lg bg-white p-5"><p class="text-gray-500">회원</p>
            <p class="mt-1 text-3xl font-extrabold" th:text="${#numbers.formatInteger(members, 1, 'COMMA')}">0</p></div>
        <a th:href="@{/admin/products}" class="rounded-lg bg-white p-5 hover:ring-2 hover:ring-brand-500"><p class="text-gray-500">상품</p>
            <p class="mt-1 text-3xl font-extrabold" th:text="${#numbers.formatInteger(products, 1, 'COMMA')}">0</p></a>
    </div>
    <p class="mt-6 text-xs text-gray-500">모든 수치는 가짜 데이터 기준입니다.</p>
</main>
</body>
</html>
