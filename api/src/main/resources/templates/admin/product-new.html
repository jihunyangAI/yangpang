<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, ~{::main}, 'products')}">
<head><title>직매입 상품 등록 - YangPang 관리자</title></head>
<body>
<main class="max-w-2xl">
    <h1 class="mb-1 text-xl font-bold">직매입 상품 등록</h1>
    <p class="mb-6 text-xs text-gray-500">양팡 직매입(1P) 상품을 등록합니다. 판매자 상품 등록은 셀러센터(M3)에서 추가됩니다. 이미지는 자동으로 가짜 이미지가 붙습니다.</p>

    <form th:action="@{/admin/products/new}" method="post" class="space-y-5 rounded-lg bg-white p-6">
        <label class="block"><span class="mb-1 block font-semibold">카테고리 (소분류)</span>
            <select name="categoryId" required class="input">
                <option value="">선택하세요</option>
                <option th:each="l : ${leaves}" th:value="${l.id}" th:text="${l.path}">경로</option>
            </select></label>
        <div class="grid grid-cols-2 gap-3">
            <label class="block"><span class="mb-1 block font-semibold">브랜드 <span class="font-normal text-gray-400">(없으면 새로 생성)</span></span>
                <input name="brandName" class="input" placeholder="예: 모아홈"></label>
            <label class="block"><span class="mb-1 block font-semibold">배송</span>
                <select name="deliveryType" class="input"><option value="YANGPANG">양팡배송</option><option value="FRESH">양팡프레시 (신선)</option></select></label>
        </div>
        <label class="block"><span class="mb-1 block font-semibold">상품명</span>
            <input name="name" required maxlength="200" class="input"></label>
        <label class="block"><span class="mb-1 block font-semibold">상품 설명 <span class="font-normal text-gray-400">(일반 텍스트, 빈 줄로 문단 구분)</span></span>
            <textarea name="description" rows="4" class="input"></textarea></label>

        <fieldset class="rounded-md border border-gray-200 p-4">
            <legend class="px-1 font-semibold">옵션 <span class="font-normal text-gray-400">(비우면 단일 상품)</span></legend>
            <div class="grid grid-cols-[120px_1fr] gap-2">
                <input name="option1Name" class="input" placeholder="색상">
                <input name="option1Values" class="input" placeholder="블랙, 화이트, 네이비 (쉼표로 구분)">
                <input name="option2Name" class="input" placeholder="사이즈">
                <input name="option2Values" class="input" placeholder="S, M, L">
            </div>
            <p class="mt-2 text-xs text-gray-500">옵션 조합(예: 3색 x 3사이즈 = 9개)마다 같은 가격·재고로 판매 오퍼가 만들어집니다. 등록 후 조합별로 수정할 수 있어요.</p>
        </fieldset>

        <div class="grid grid-cols-3 gap-3">
            <label class="block"><span class="mb-1 block font-semibold">정가</span>
                <input name="listPrice" type="number" min="0" step="100" required class="input"></label>
            <label class="block"><span class="mb-1 block font-semibold">판매가</span>
                <input name="salePrice" type="number" min="100" step="100" required class="input"></label>
            <label class="block"><span class="mb-1 block font-semibold">재고 (조합당)</span>
                <input name="stock" type="number" min="0" value="100" required class="input"></label>
        </div>
        <div class="flex gap-2">
            <a th:href="@{/admin/products}" class="btn-outline flex-1">취소</a>
            <button type="submit" class="btn-primary flex-1">등록</button>
        </div>
    </form>
</main>
</body>
</html>
