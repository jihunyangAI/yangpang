<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, ~{::main}, 'emails')}">
<head><title>보낸 메일함 (모의) - YangPang 관리자</title></head>
<body>
<main class="space-y-4">
    <div class="flex flex-wrap items-end justify-between gap-2">
        <div>
            <h1 class="text-xl font-bold">보낸 메일함 <span class="text-base font-normal text-gray-500">(모의)</span></h1>
            <p class="text-xs text-gray-500" th:text="'알림을 보낼 때 이메일도 보낸 것처럼 기록해요 (실제 발송 없음) · 오늘 ' + ${today} + '통 · 최근 100통'">안내</p>
        </div>
        <form th:action="@{/admin/emails}" method="get" class="flex gap-2">
            <input name="to" th:value="${to}" class="input h-9 w-56 py-0 text-sm" placeholder="받는 사람 이메일로 찾기" aria-label="받는 사람">
            <button class="btn-outline h-9 bg-white px-4 text-sm">찾기</button>
        </form>
    </div>
    <div class="overflow-x-auto rounded-lg bg-white">
        <table class="w-full min-w-[720px] text-left text-xs">
            <thead class="bg-gray-50 text-gray-500"><tr><th class="px-3 py-2">보낸 시각</th><th class="px-3 py-2">받는 사람</th>
                <th class="px-3 py-2">종류</th><th class="px-3 py-2">제목 · 본문</th><th class="px-3 py-2">읽음</th></tr></thead>
            <tbody class="divide-y divide-gray-100">
            <tr th:if="${#lists.isEmpty(mails)}"><td colspan="5" class="px-3 py-8 text-center text-gray-400">보낸 메일이 없어요</td></tr>
            <tr th:each="m : ${mails}">
                <td class="whitespace-nowrap px-3 py-2" th:text="${@fmt.dateTime(m.createdAt)}"></td>
                <td class="px-3 py-2" th:text="${m.to}"></td>
                <td class="px-3 py-2" th:text="${m.category}"></td>
                <td class="max-w-md px-3 py-2"><b class="block truncate" th:text="${m.subject}"></b><span class="block truncate text-gray-500" th:text="${m.body}"></span></td>
                <td class="px-3 py-2" th:text="${m.read} ? '읽음' : '-'"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
