<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, ~{::main}, 'cs')}">
<head><title>FAQ 관리 - YangPang 관리자</title></head>
<body>
<main class="space-y-4">
    <div class="flex items-center justify-between">
        <h1 class="text-xl font-bold">FAQ 관리 <span class="text-base font-normal text-gray-500" th:text="${#lists.size(faqs)} + '개'"></span></h1>
        <a th:href="@{/admin/cs}" class="text-sm text-gray-500 hover:underline">‹ 1:1 문의</a>
    </div>

    <details class="rounded-lg bg-white p-4 text-sm">
        <summary class="cursor-pointer font-bold">새 FAQ 추가</summary>
        <form th:action="@{/admin/faq}" method="post" class="mt-3 grid gap-2">
            <div class="flex gap-2">
                <select name="category" class="input h-9 w-48 py-0 text-sm" aria-label="분류"><option th:each="c : ${categories}" th:value="${c.name()}" th:text="${c.label()}"></option></select>
                <input name="sortOrder" type="number" value="10" class="input h-9 w-24 py-0 text-sm" aria-label="순서">
            </div>
            <input name="question" required maxlength="200" class="input text-sm" placeholder="질문">
            <textarea name="answer" required rows="3" class="input text-sm" placeholder="답변"></textarea>
            <button class="btn-primary h-9 w-32 text-sm">추가</button>
        </form>
    </details>

    <details th:each="f : ${faqs}" class="rounded-lg bg-white p-4 text-sm">
        <summary class="cursor-pointer"><span class="badge mr-1 bg-gray-100 text-gray-600" th:text="${f.category.label()}"></span>
            <b th:text="${f.question}">질문</b> <span class="text-xs text-gray-400" th:text="'· 본 수 ' + ${f.viewCount}"></span></summary>
        <form th:action="@{/admin/faq}" method="post" class="mt-3 grid gap-2">
            <input type="hidden" name="id" th:value="${f.id}">
            <div class="flex gap-2">
                <select name="category" class="input h-9 w-48 py-0 text-sm" aria-label="분류">
                    <option th:each="c : ${categories}" th:value="${c.name()}" th:text="${c.label()}" th:selected="${c == f.category}"></option></select>
                <input name="sortOrder" type="number" th:value="${f.sortOrder}" class="input h-9 w-24 py-0 text-sm" aria-label="순서">
            </div>
            <input name="question" required maxlength="200" th:value="${f.question}" class="input text-sm" aria-label="질문">
            <textarea name="answer" required rows="3" class="input text-sm" th:text="${f.answer}" aria-label="답변"></textarea>
            <div class="flex gap-2"><button class="btn-primary h-9 w-24 text-sm">저장</button></div>
        </form>
        <form th:action="@{/admin/faq/{id}/delete(id=${f.id})}" method="post" class="mt-2"><button class="text-xs text-rose-600 hover:underline">이 FAQ 지우기</button></form>
    </details>
</main>
</body>
</html>
