<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>모의 결제 - YangPang</title>
</head>
<body>
<main class="flex-1 py-10">
    <div class="mx-auto w-full max-w-md px-4">
        <div class="rounded-lg border-2 border-dashed border-brand-500 bg-white p-6 text-center">
            <p class="text-xs font-bold uppercase tracking-widest text-brand-700">Mock Payment</p>
            <h1 class="mt-1 text-xl font-bold">연구용 모의 결제</h1>
            <p class="mt-2 text-sm text-gray-500">실제 결제는 일어나지 않습니다. 결과를 골라 주세요.</p>

            <dl class="mt-6 space-y-2 rounded-md bg-gray-50 p-4 text-left text-sm">
                <div class="flex justify-between"><dt class="text-gray-500">주문번호</dt><dd class="font-mono" th:text="${order.orderNo}">번호</dd></div>
                <div class="flex justify-between"><dt class="text-gray-500">주문상품</dt><dd class="ml-4 truncate" th:text="${order.title()}">상품</dd></div>
                <div class="flex justify-between"><dt class="text-gray-500">결제수단</dt><dd th:text="${method.label()}">양페이</dd></div>
                <div class="flex justify-between border-t border-gray-200 pt-2"><dt class="font-bold">결제금액</dt>
                    <dd class="text-lg font-extrabold text-brand-700" th:text="${#numbers.formatInteger(order.paidAmount, 1, 'COMMA')} + '원'">0원</dd></div>
            </dl>

            <form th:action="@{/checkout/pay/{no}(no=${order.orderNo})}" method="post" class="mt-6 space-y-2">
                <input type="hidden" name="method" th:value="${method.name()}">
                <button type="submit" name="result" value="APPROVED" class="btn-primary h-12 w-full text-base">✓ 결제 성공</button>
                <button type="submit" name="result" value="PENDING" th:if="${method.name() == 'BANK'}"
                        class="btn-outline h-12 w-full text-base">가상계좌 발급 (입금 대기)</button>
                <button type="submit" name="result" value="FAILED" class="btn-outline h-12 w-full text-base text-sale">✕ 결제 실패</button>
            </form>
            <p class="mt-4 text-xs text-gray-400">결제 실패를 고르면 차감했던 재고를 되돌리고 주문서로 돌아갑니다.</p>
        </div>
    </div>
</main>
</body>
</html>
