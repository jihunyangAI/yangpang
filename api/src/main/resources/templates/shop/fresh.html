<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>양팡프레시 - YangPang</title></head>
<body>
<main class="flex-1">
    <section class="relative overflow-hidden bg-gradient-to-r from-fresh to-brand-500 py-8 text-white md:py-10 lg:py-14">
        <div class="absolute right-[8%] top-1/2 hidden -translate-y-1/2 lg:block"><th:block th:with="pics=${@visuals.forLink('/fresh', 3)}"><div th:replace="~{fragments/visual :: fan(${pics}, 'md')}"></div></th:block></div>
        <div class="container-page relative">
            <p class="text-sm font-semibold opacity-90">🥬 양팡프레시</p>
            <h1 class="mt-1 text-2xl font-black md:text-4xl">밤 12시까지 주문하면 내일 아침 7시 전 도착</h1>
            <p class="mt-2 text-sm opacity-90"><b th:text="${arrival}">내일 새벽 도착</b> · <span th:text="${cutoff}"></span> · 신선식품은 냉장·냉동 포장으로 문 앞에</p>
        </div>
    </section>

    <nav class="container-page no-scrollbar flex gap-2 overflow-x-auto py-4">
        <a th:href="@{/fresh}" class="shrink-0 rounded-full px-4 py-1.5 text-sm"
           th:classappend="${category == null} ? 'bg-fresh text-white' : 'bg-gray-100 hover:bg-gray-200'">전체</a>
        <a th:each="c : ${top.children()}" th:href="@{/fresh(category=${c.id})}" th:text="${c.name}"
           class="shrink-0 rounded-full px-4 py-1.5 text-sm"
           th:classappend="${category == c.id} ? 'bg-fresh text-white' : 'bg-gray-100 hover:bg-gray-200'">분류</a>
    </nav>

    <section class="container-page pb-8">
        <div class="mb-3 flex items-end justify-between">
            <h2 class="text-lg font-bold">새벽배송 많이 산 상품</h2>
            <a th:href="@{/search(delivery='FRESH', sort='sales')}" class="text-sm text-gray-500 hover:underline">전체보기</a>
        </div>
        <div class="grid grid-cols-2 gap-x-3 gap-y-6 sm:grid-cols-3 md:grid-cols-5">
            <th:block th:each="card : ${best}"><a th:replace="~{fragments/product-card :: card(${card})}"></a></th:block>
        </div>
        <p th:if="${#lists.isEmpty(best)}" class="py-10 text-center text-sm text-gray-400">이 분류에는 새벽배송 상품이 없어요</p>
    </section>

    <section class="container-page pb-10">
        <h2 class="mb-3 text-lg font-bold">새로 들어온 신선식품</h2>
        <div class="grid grid-cols-2 gap-x-3 gap-y-6 sm:grid-cols-3 md:grid-cols-5">
            <th:block th:each="card : ${latest}"><a th:replace="~{fragments/product-card :: card(${card})}"></a></th:block>
        </div>
    </section>
</main>
</body>
</html>
