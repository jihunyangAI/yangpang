<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>기획전 - YangPang</title></head>
<body>
<main class="flex-1">
    <div class="container-page py-6">
        <h1 class="text-2xl font-black">🎪 기획전</h1>
        <p class="mt-1 text-sm text-gray-500">테마별로 골라 모은 상품과 전용 쿠폰</p>
        <!-- 상시 이벤트 -->
        <div class="mt-5 grid gap-4 md:grid-cols-2">
            <a th:href="@{/attendance}" class="block rounded-xl bg-gradient-to-r from-yellow-300 to-orange-300 p-6 transition hover:opacity-95">
                <p class="text-xs font-semibold text-gray-700">매일 · 상시</p>
                <h2 class="mt-1 text-xl font-black">📅 출석체크</h2>
                <p class="mt-1 text-sm text-gray-800" th:text="|하루 한 번 ${#numbers.formatInteger(policy['ATTENDANCE_DAILY_CASH'], 1, 'COMMA')}원, 7일 연속이면 보너스|">혜택</p></a>
            <a th:href="@{/my/invite}" class="block rounded-xl bg-gradient-to-r from-sky-300 to-indigo-300 p-6 transition hover:opacity-95">
                <p class="text-xs font-semibold text-gray-700">상시</p>
                <h2 class="mt-1 text-xl font-black">💌 친구초대</h2>
                <p class="mt-1 text-sm text-gray-800" th:text="|친구도 나도 ${#numbers.formatInteger(policy['INVITE_REWARD_CASH'], 1, 'COMMA')}원씩 양팡캐시|">혜택</p></a>
        </div>
        <p th:if="${#lists.isEmpty(events)}" class="py-16 text-center text-gray-400">진행 중인 기획전이 없어요</p>
        <ul class="mt-5 grid gap-4 md:grid-cols-2">
            <li th:each="e : ${events}">
                <a th:href="@{/events/{slug}(slug=${e.slug})}"
                   class="relative flex min-h-[176px] flex-col overflow-hidden rounded-3xl bg-gradient-to-r p-6 text-white transition hover:-translate-y-0.5 hover:shadow-lg sm:flex-row sm:items-center" th:classappend="${e.theme.gradient()}">
                    <th:block th:with="pics=${@visuals.exhibition(e.id, 3)}">
                    <!-- 모바일: 위쪽 사진 띠 / 넓은 화면: 오른쪽 펼친 사진 -->
                    <div class="-mx-6 -mt-6 mb-4 sm:hidden"><div th:replace="~{fragments/visual :: strip(${pics}, 'h-28')}"></div></div>
                    <div class="absolute right-2 top-1/2 hidden -translate-y-1/2 scale-90 sm:block"><div th:replace="~{fragments/visual :: fan(${pics}, 'md')}"></div></div>
                    </th:block>
                    <div class="relative sm:max-w-[58%]">
                    <p class="text-xs font-semibold opacity-80" th:text="${@fmt.date(e.startsAt)} + ' ~ ' + ${@fmt.date(e.endsAt)}"></p>
                    <h2 class="mt-1 text-xl font-black" th:text="${e.title}">기획전</h2>
                    <p class="mt-1 text-sm opacity-90" th:text="${e.subtitle}"></p>
                    <p class="mt-3 text-xs font-bold">
                        <span th:text="'상품 ' + ${productCounts.getOrDefault(e.id, 0L)} + '개'"></span>
                        <span th:if="${e.couponId != null}" class="ml-1 rounded bg-white/25 px-1.5 py-0.5">🎟️ 전용 쿠폰</span>
                    </p>
                    </div>
                </a>
            </li>
        </ul>
    </div>
</main>
</body>
</html>
