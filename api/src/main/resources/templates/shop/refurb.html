<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>리퍼마켓 - YangPang</title></head>
<body>
<main class="flex-1">
    <section class="relative overflow-hidden bg-gradient-to-r from-gray-900 to-gray-700 py-8 text-white lg:py-14">
        <div class="absolute right-[8%] top-1/2 hidden -translate-y-1/2 lg:block"><th:block th:with="pics=${@visuals.forLink('/refurb', 3)}"><div th:replace="~{fragments/visual :: fan(${pics}, 'md')}"></div></th:block></div>
        <div class="container-page relative">
            <h1 class="text-2xl font-black md:text-3xl">♻️ 리퍼마켓</h1>
            <p class="mt-1 text-sm text-gray-300">반품·파손 상품을 양팡이 검수해 등급별로 싸게 팝니다. 수량이 적어 금방 품절돼요</p>
        </div>
    </section>
    <div class="container-page py-5">
        <nav class="no-scrollbar mb-3 flex gap-2 overflow-x-auto">
            <a th:href="@{/refurb}" class="shrink-0 rounded-full px-4 py-1.5 text-sm"
               th:classappend="${grade == null} ? 'bg-gray-900 text-white' : 'bg-gray-100 hover:bg-gray-200'">전체</a>
            <a th:each="g : ${grades}" th:href="@{/refurb(grade=${g.name()})}" th:text="${g.label()}"
               class="shrink-0 rounded-full px-4 py-1.5 text-sm"
               th:classappend="${grade == g.name()} ? 'bg-gray-900 text-white' : 'bg-gray-100 hover:bg-gray-200'">등급</a>
        </nav>
        <dl class="mb-5 grid gap-2 rounded-lg bg-gray-50 p-3 text-xs text-gray-600 sm:grid-cols-3">
            <div th:each="g : ${grades}"><dt class="inline font-bold" th:text="${g.label()}"></dt> <dd class="inline" th:text="'· ' + ${g.description()}"></dd></div>
        </dl>
        <p th:if="${#lists.isEmpty(cards)}" class="py-16 text-center text-gray-400">지금은 리퍼 상품이 없어요</p>
        <ul class="grid grid-cols-2 gap-x-3 gap-y-6 md:grid-cols-4 lg:grid-cols-5">
            <li th:each="c : ${cards}">
                <a th:href="@{/products/{id}(id=${c.productId}, item=${c.itemId})}" class="block">
                    <div class="relative overflow-hidden rounded-lg bg-gray-50">
                        <img th:src="${c.imageUrl()}" th:alt="${c.name}" class="aspect-square w-full object-cover" loading="lazy">
                        <span class="absolute left-2 top-2 rounded bg-gray-900 px-2 py-0.5 text-xs font-bold text-white" th:text="${c.gradeLabel}">리퍼</span>
                        <span th:if="${c.stock <= 2}" class="absolute right-2 top-2 rounded bg-sale px-2 py-0.5 text-xs font-bold text-white" th:text="${c.stock} + '개 남음'"></span>
                    </div>
                    <p class="mt-2 line-clamp-2 text-sm" th:text="${c.name}">상품</p>
                    <p class="text-xs text-gray-400" th:text="${c.subtitle()}"></p>
                    <div class="mt-1 flex items-baseline gap-1.5">
                        <span class="text-sm font-bold text-sale" th:text="${c.discountRate()} + '%'"></span>
                        <span class="text-xs text-gray-400">새 상품 <del th:text="${#numbers.formatInteger(c.newPrice, 3, 'COMMA')} + '원'"></del></span>
                    </div>
                    <p class="text-base font-extrabold" th:text="${#numbers.formatInteger(c.price, 3, 'COMMA')} + '원'">0원</p>
                    <p th:if="${c.note != null}" class="mt-1 line-clamp-2 text-xs text-gray-500" th:text="${c.note}"></p>
                </a>
                <form hx-post="/cart/items" hx-target="#toast" class="mt-2">
                    <input type="hidden" name="vendorItemId" th:value="${c.vendorItemId}">
                    <input type="hidden" name="quantity" value="1">
                    <button class="btn-outline h-9 w-full">장바구니 담기</button>
                </form>
            </li>
        </ul>
        <p class="mt-8 text-xs text-gray-400">· 리퍼 상품은 1회 1개까지 살 수 있고 양팡배송으로 보내 드려요. 등급 설명과 다른 상품이 오면 무료로 반품할 수 있어요.</p>
    </div>
</main>
</body>
</html>
