<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{seller/layout :: layout(~{::title}, ~{::main}, 'inquiries')}">
<head><title>상품문의 - YangPang 셀러센터</title></head>
<body>
<main>
    <h1 class="mb-1 text-xl font-bold">상품문의</h1>
    <p class="mb-4 text-xs text-gray-500">내가 판매 오퍼를 가진 상품에 달린 문의입니다. 같은 상품을 파는 다른 판매자나 운영자가 먼저 답변하면 답변완료로 바뀝니다. 비밀글도 판매자에게는 보입니다.</p>
    <nav class="mb-4 flex flex-wrap gap-1">
        <a th:href="@{/seller/inquiries}" class="rounded-full px-3 py-1.5" th:classappend="${!all} ? 'bg-indigo-700 text-white' : 'bg-white hover:bg-gray-50'">답변 대기</a>
        <a th:href="@{/seller/inquiries(all=true)}" class="rounded-full px-3 py-1.5" th:classappend="${all} ? 'bg-indigo-700 text-white' : 'bg-white hover:bg-gray-50'">전체</a>
    </nav>

    <p th:if="${#lists.isEmpty(inquiries)}" class="rounded-lg bg-white px-4 py-10 text-center text-gray-400">답변을 기다리는 문의가 없어요</p>
    <ul class="space-y-3">
        <li th:each="q : ${inquiries}" class="rounded-lg bg-white p-4">
            <div class="flex flex-wrap items-center justify-between gap-2 text-xs text-gray-500">
                <a th:href="@{/products/{id}(id=${q.productId})}" class="line-clamp-1 font-medium text-gray-900 hover:underline" th:text="${q.productName}"></a>
                <span><span class="badge bg-gray-100 text-gray-600" th:text="${q.typeLabel}"></span>
                    <span th:if="${q.secret}" class="badge bg-amber-50 text-amber-700">비밀글</span>
                    <span th:text="${q.asker} + ' · ' + ${@fmt.dateTime(q.createdAt)}"></span></span>
            </div>
            <p class="mt-2 whitespace-pre-line" th:text="'Q. ' + ${q.content}">문의</p>
            <p th:if="${q.answered()}" class="mt-2 whitespace-pre-line rounded bg-gray-50 p-3 text-gray-700"
               th:text="(${q.answeredBy == 'SELLER'} ? '판매자 답변 · ' : '운영자 답변 · ') + ${q.answer}">답변</p>
            <form th:unless="${q.answered()}" th:action="@{/seller/inquiries/{id}/answer(id=${q.id})}" method="post" class="mt-3 flex flex-col gap-2 md:flex-row">
                <textarea name="answer" required maxlength="2000" rows="2" placeholder="답변을 입력하세요" class="input min-w-0 flex-1"></textarea>
                <button class="btn-primary h-10 px-5 md:self-end">답변 등록</button>
            </form>
        </li>
    </ul>
</main>
</body>
</html>
