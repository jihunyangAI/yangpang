<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>입점 심사 - YangPang</title></head>
<body>
<main class="flex-1 py-12">
    <div class="mx-auto w-full max-w-md rounded-lg bg-white p-8 text-center text-sm">
        <p class="text-4xl" th:text="${seller.status == 'REJECTED'} ? '🙅' : '⏳'">⏳</p>
        <h1 class="mt-3 text-xl font-bold" th:text="${seller.status == 'REJECTED'} ? '입점 신청이 반려되었어요' : '입점 심사 중이에요'">심사 중</h1>
        <p class="mt-2 text-gray-500" th:text="${seller.name} + ' · 신청일 ' + ${@fmt.date(seller.createdAt)}"></p>
        <p class="mt-4 text-xs text-gray-400" th:if="${seller.status != 'REJECTED'}">운영자 화면(관리자 › 판매자)에서 승인하면 셀러센터가 열립니다.</p>
        <a th:href="@{/}" class="btn-outline mt-6">쇼핑 계속하기</a>
    </div>
</main>
</body>
</html>
