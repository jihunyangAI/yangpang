<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{seller/layout :: layout(~{::title}, ~{::main}, 'offers')}">
<head><title>판매 상품 - YangPang 셀러센터</title></head>
<body>
<main>
    <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
        <h1 class="text-xl font-bold">판매 상품 <span class="text-base font-normal text-gray-500" th:text="${#lists.size(offers) >= 200} ? '200개까지 표시 · 검색으로 좁혀 보세요' : ${#lists.size(offers)} + '개'"></span></h1>
        <div class="flex gap-2">
            <a th:href="@{/seller/products/new}" class="btn-primary">+ 새 상품 등록</a>
            <a th:href="@{/seller/catalog}" class="btn-outline bg-white">기존 상품에 판매 추가</a>
        </div>
    </div>
    <form th:action="@{/seller/offers}" method="get" class="mb-4 flex flex-wrap items-center gap-2">
        <input name="q" th:value="${q}" placeholder="상품명" class="input max-w-xs bg-white">
        <label class="flex items-center gap-1"><input type="checkbox" name="losing" value="true" th:checked="${losing}"> 위너 아닌 것만</label>
        <button class="btn-outline bg-white">검색</button>
    </form>
    <div class="overflow-x-auto rounded-lg bg-white">
        <table class="w-full min-w-[860px] text-left">
            <thead class="border-b border-gray-200 bg-gray-50 text-xs text-gray-500">
            <tr><th class="px-3 py-2">상품 / 옵션</th><th class="px-3 py-2">위너</th><th class="px-3 py-2 text-right">경쟁 최저가</th>
                <th class="px-3 py-2">정가</th><th class="px-3 py-2">판매가</th><th class="px-3 py-2">재고</th><th class="px-3 py-2">상태</th><th></th></tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
            <tr th:each="o : ${offers}">
                <td class="max-w-xs px-3 py-2"><a th:href="@{/products/{id}(id=${o.productId})}" class="line-clamp-1 font-medium hover:underline" th:text="${o.productName}"></a>
                    <span class="text-xs text-gray-400" th:text="${o.optionText ?: '단일 상품'} + ' · ' + ${o.deliveryLabel}"></span></td>
                <td class="px-3 py-2">
                    <span th:if="${o.winner}" class="badge bg-indigo-50 text-indigo-700">위너</span>
                    <span th:unless="${o.winner}" class="badge bg-gray-100 text-gray-500">-</span>
                    <span class="block text-xs text-gray-400" th:if="${o.competitors > 0}" th:text="'경쟁 ' + ${o.competitors}"></span></td>
                <td class="px-3 py-2 text-right" th:text="${o.lowestOther == null} ? '-' : ${#numbers.formatInteger(o.lowestOther, 1, 'COMMA')} + '원'"
                    th:classappend="${o.lowestOther != null and o.lowestOther < o.salePrice} ? 'font-bold text-sale'">-</td>
                <td colspan="5" class="px-3 py-2">
                    <form th:action="@{/seller/offers/{id}(id=${o.id})}" method="post" class="flex items-center gap-2">
                        <input name="listPrice" type="number" min="0" step="10" th:value="${o.listPrice}" class="input h-8 w-24">
                        <input name="salePrice" type="number" min="100" step="10" th:value="${o.salePrice}" class="input h-8 w-24">
                        <input name="stock" type="number" min="0" th:value="${o.stock}" class="input h-8 w-20">
                        <select name="status" class="input h-8 w-28 py-0 text-sm">
                            <option value="ON_SALE" th:selected="${o.status == 'ON_SALE'}">판매중</option>
                            <option value="STOPPED" th:selected="${o.status == 'STOPPED'}">판매중지</option>
                        </select>
                        <button class="btn-outline h-8 px-3">저장</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <p th:if="${#lists.isEmpty(offers)}" class="p-8 text-center text-gray-400">판매 중인 상품이 없어요</p>
    </div>
</main>
</body>
</html>
