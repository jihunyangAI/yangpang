<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  홈 무료배송(양팡플러스) 배너 슬라이드. 다른 배너 슬라이드와 같은 틀(단색 바탕·왼쪽 아래 글자·오른쪽 사진 카드)에
  "배송비 3,000원 → 0원" 한 줄과, 사진 아래 길을 천천히 지나가는 작은 트럭 하나만 더했다.
  pics: 플러스 회원가 상품 사진(@visuals), fee: 양팡배송 배송비. 움직임은 app.css의 .yp-free 참고
-->
<a th:fragment="plus(b, pics, fee)" th:href="${b.linkUrl}"
   class="yp-free relative flex h-52 w-full shrink-0 snap-start items-end overflow-hidden bg-plus p-6 text-white md:h-[360px] md:p-11">
    <!-- PC: 펼친 사진 카드 + 그 아래 길 위의 트럭 -->
    <div class="absolute right-10 top-[44%] hidden -translate-y-1/2 lg:block"><div th:replace="~{fragments/visual :: fan(${pics}, 'md')}"></div></div>
    <div class="yp-lane pointer-events-none absolute bottom-[46px] right-10 hidden w-[250px] lg:block" aria-hidden="true">
        <svg class="yp-truck" width="58" height="32" viewBox="0 0 200 112" fill="none">
            <rect x="8" y="10" width="118" height="68" rx="12" fill="#fffdf9"/>
            <rect x="8" y="54" width="118" height="8" fill="#c0573a"/>
            <path d="M126 30h34c6 0 11 3 14 8l14 20c2 3 3 6 3 9v11H126z" fill="#dee5ee"/>
            <path d="M136 38h22c3 0 6 2 7 4l9 13h-38z" fill="#4f6d8f"/>
            <circle cx="46" cy="86" r="15" fill="#1e2f44" stroke="#fffdf9" stroke-width="5"/>
            <circle cx="158" cy="86" r="15" fill="#1e2f44" stroke="#fffdf9" stroke-width="5"/>
        </svg>
    </div>
    <!-- 모바일: 사진 한 장 (다른 슬라이드와 같은 자리) -->
    <img th:if="${!#lists.isEmpty(pics)}" th:src="${pics[0]}" alt="" aria-hidden="true" loading="lazy"
         class="absolute -right-4 -top-3 h-32 w-32 rotate-6 rounded-[22px] object-cover opacity-95 shadow-xl ring-4 ring-white/70 lg:hidden">

    <div class="relative max-w-[62%] lg:max-w-[48%]">
        <p class="text-xs font-medium tracking-[0.15em] opacity-90 md:text-sm"
           th:text="${b.caption != null} ? ${b.caption} : '양팡플러스'">양팡플러스</p>
        <p class="mt-2 break-keep font-serif text-[26px] font-bold leading-snug md:text-[42px]" th:text="${b.title}">제목</p>
        <p class="yp-fee mt-3 text-sm md:mt-4 md:text-base">
            <span class="opacity-75">배송비</span>
            <span class="yp-fee-old" th:text="${#numbers.formatInteger(fee, 1, 'COMMA')} + '원'">3,000원</span>
            <span class="yp-fee-new">0원</span>
        </p>
        <p th:if="${b.subtitle != null}" class="mt-2 hidden text-sm opacity-80 sm:block md:text-base" th:text="${b.subtitle}">설명</p>
    </div>
</a>
</body>
</html>
