<!DOCTYPE html>
<!--
  공통 레이아웃. 각 화면은 아래처럼 사용한다.
  <html th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
  주의: 화면 데이터(model) 이름으로 title, content를 쓰지 말 것 (이 레이아웃의 매개변수와 겹침 → pageTitle 사용)
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <!-- htmx 요청에 CSRF 토큰을 헤더로 붙이기 위한 값 (app.js가 사용) -->
    <meta name="csrf-token" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="csrf-header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <title th:replace="${title}">YangPang</title>
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@600;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/htmx.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body class="flex min-h-screen flex-col">

<!-- 연구용 데모 안내 (기획서 11장: 모든 화면 상시 노출) -->
<div class="bg-gray-900 py-1.5 text-center text-xs text-gray-200">
    <span class="md:hidden">연구용 데모 · 판매·결제 없음 · 모든 정보는 가짜</span>
    <span class="hidden md:inline">연구용 데모 서비스입니다 · 실제로 판매하거나 결제하지 않으며 모든 정보는 가짜입니다</span>
</div>

<header th:replace="~{fragments/header :: header}"></header>

<main th:replace="${content}" class="flex-1"></main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<!-- 토스트 알림 (htmx 응답 조각이 여기 들어오고 app.js가 잠시 뒤 지움) -->
<div id="toast" aria-live="polite"
     class="pointer-events-none fixed inset-x-0 bottom-24 z-50 flex justify-center px-4 md:bottom-8"><div
        th:if="${welcome != null}" th:text="${welcome} + '님, 양팡에 오신 걸 환영해요!'"
        class="pointer-events-auto rounded-full bg-gray-900/90 px-5 py-3 text-sm text-white shadow-lg"></div><div
        th:if="${flashMessage != null}" th:text="${flashMessage}"
        class="pointer-events-auto rounded-full bg-gray-900/90 px-5 py-3 text-sm text-white shadow-lg"></div></div>
<nav th:replace="~{fragments/header :: mobileTabBar}"></nav>
<!-- 쇼핑 도우미 챗봇 (M4 ⑧, API 키가 있을 때만) -->
<th:block th:if="${aiEnabled}"><details th:replace="~{ai/chat :: widget}"></details></th:block>

</body>
</html>
