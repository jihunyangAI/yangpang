<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 상품 상세의 리뷰 영역 (htmx로 불러옴) -->
<section id="reviews-section" th:fragment="section" class="text-sm">

    <!-- 요약 -->
    <div th:if="${summary.total > 0}" class="grid gap-6 rounded-lg bg-gray-50 p-5 md:grid-cols-[200px_1fr_1fr]">
        <div class="text-center">
            <p class="text-4xl font-extrabold" th:text="${summary.average}">4.5</p>
            <span class="stars text-lg"><span th:style="'width:' + ${summary.average * 20} + '%'"></span></span>
            <p class="mt-1 text-gray-500" th:text="${#numbers.formatInteger(summary.total, 1, 'COMMA')} + '개 상품평'">0</p>
        </div>
        <div class="space-y-1">
            <div th:each="b : ${summary.bars}" class="flex items-center gap-2 text-xs">
                <span class="w-8 text-gray-500" th:text="${b.stars} + '점'">5점</span>
                <span class="h-2 flex-1 overflow-hidden rounded-full bg-gray-200"><span class="block h-full bg-star" th:style="'width:' + ${b.percent} + '%'"></span></span>
                <span class="w-9 text-right text-gray-500" th:text="${b.percent} + '%'">0%</span>
            </div>
        </div>
        <div class="space-y-2">
            <div th:each="s : ${summary.surveys}">
                <p class="text-xs font-semibold text-gray-700" th:text="${s.question}">사이즈</p>
                <p class="text-xs text-gray-500">
                    <span th:each="c, st : ${s.choices}" th:classappend="${c.top} ? 'font-bold text-gray-900'"
                          th:text="${c.label} + ' ' + ${c.percent} + '%' + (${st.last} ? '' : ' · ')">답</span>
                </p>
            </div>
        </div>
    </div>
    <div th:if="${summary.total == 0}" class="rounded-lg bg-gray-50 p-8 text-center text-gray-500">
        아직 상품평이 없어요. 구매 후 첫 리뷰를 남겨 주세요.
    </div>

    <!-- 사진 리뷰 모아보기 -->
    <div th:if="${!#lists.isEmpty(summary.photos)}" class="mt-4">
        <p class="mb-2 font-semibold">사진 리뷰</p>
        <div class="no-scrollbar flex gap-2 overflow-x-auto">
            <img th:each="ph : ${summary.photos}" th:src="${ph.url}" alt="리뷰 사진" class="h-20 w-20 shrink-0 rounded object-cover">
        </div>
    </div>

    <!-- 필터 (바꾸면 이 영역 전체를 다시 불러옴) -->
    <form th:if="${summary.total > 0}" class="mt-5 flex flex-wrap items-center gap-2"
          th:attr="hx-get=@{/products/{id}/reviews(id=${productId})}" hx-target="#reviews-section" hx-swap="outerHTML"
          hx-trigger="change, submit">
        <select name="sort" class="rounded border border-gray-300 px-2 py-1.5">
            <option th:each="s : ${sorts}" th:value="${s}" th:text="${s.label}" th:selected="${s == sort}">정렬</option>
        </select>
        <select name="rating" class="rounded border border-gray-300 px-2 py-1.5">
            <option value="0">모든 별점</option>
            <option th:each="r : ${ {5,4,3,2,1} }" th:value="${r}" th:text="${r} + '점'" th:selected="${r == rating}">5점</option>
        </select>
        <label class="flex items-center gap-1"><input type="checkbox" name="photo" value="true" th:checked="${photo}" class="accent-brand-600"> 사진 리뷰만</label>
        <input type="search" name="q" th:value="${q}" placeholder="리뷰 키워드 검색" class="w-40 rounded border border-gray-300 px-2 py-1.5">
        <span class="text-xs text-gray-500" th:text="${#numbers.formatInteger(list.total, 1, 'COMMA')} + '개'"></span>
    </form>

    <!-- 목록 -->
    <div class="mt-3 divide-y divide-gray-100">
        <th:block th:fragment="items">
            <article th:each="r : ${list.items}" class="py-5">
                <div class="flex flex-wrap items-center gap-2 text-xs text-gray-500">
                    <span class="stars"><span th:style="'width:' + ${r.ratingPercent()} + '%'"></span></span>
                    <b class="text-gray-800" th:text="${r.reviewer}">김*트</b>
                    <span th:text="${@fmt.date(r.createdAt)}">날짜</span>
                    <span th:if="${r.verified}" class="badge bg-brand-50 text-brand-700">구매 인증</span>
                    <span th:if="${r.mine}" class="badge bg-gray-100 text-gray-600">내 리뷰</span>
                </div>
                <p th:if="${r.optionText != null}" class="mt-1 text-xs text-gray-400" th:text="${r.optionText}">옵션</p>
                <p th:if="${r.sponsored}" class="mt-2 rounded bg-yellow-50 px-2 py-1 text-xs text-yellow-800">
                    양팡체험단 이벤트로 상품을 무료로 제공받아 작성된 후기입니다.</p>
                <p th:if="${r.headline != null}" class="mt-2 font-bold" th:text="${r.headline}">한 줄 요약</p>
                <div th:if="${!r.survey.isEmpty()}" class="mt-1 flex flex-wrap gap-1.5 text-xs">
                    <span th:each="e : ${r.survey}" class="rounded bg-gray-100 px-1.5 py-0.5 text-gray-600" th:text="${e.key} + ' · ' + ${e.value}"></span>
                </div>
                <p class="mt-2 whitespace-pre-line leading-relaxed text-gray-700" th:text="${r.content}">내용</p>
                <div th:if="${!#lists.isEmpty(r.photos)}" class="mt-2 flex gap-2">
                    <img th:each="ph : ${r.photos}" th:src="${ph}" alt="리뷰 사진" loading="lazy" class="h-20 w-20 rounded object-cover">
                </div>
                <div th:if="${r.sellerReply != null}" class="mt-3 rounded bg-gray-50 p-3 text-xs text-gray-600">
                    <b class="text-gray-800">판매자 답글</b><p class="mt-1 whitespace-pre-line" th:text="${r.sellerReply}"></p>
                </div>
                <div class="mt-3 flex items-center gap-3 text-xs">
                    <button th:fragment="helpful" type="button" th:id="'helpful-' + ${reviewId ?: r.id}"
                            th:attr="hx-post=@{/reviews/{id}/helpful(id=${reviewId ?: r.id})}" hx-swap="outerHTML"
                            class="rounded-full border px-3 py-1"
                            th:classappend="${voted == true} ? 'border-brand-600 text-brand-700' : 'border-gray-300 text-gray-600 hover:bg-gray-50'"
                            th:text="'👍 도움이 돼요 ' + ${count ?: r.helpfulCount}">도움이 돼요</button>
                    <button th:unless="${r.mine}" type="button" th:attr="hx-post=@{/reviews/{id}/report(id=${r.id})}"
                            hx-swap="none" class="text-gray-400 hover:text-gray-700">신고</button>
                </div>
            </article>
            <div th:if="${list.hasNext}" class="py-4 text-center">
                <button type="button" class="btn-outline"
                        th:attr="hx-get=@{/products/{id}/reviews(id=${productId}, sort=${sort}, rating=${rating}, photo=${photo}, q=${q}, page=${list.page + 1})}"
                        hx-target="closest div" hx-swap="outerHTML">리뷰 더보기</button>
            </div>
        </th:block>
    </div>
    <p th:if="${summary.total > 0 and #lists.isEmpty(list.items)}" class="py-8 text-center text-gray-500">조건에 맞는 리뷰가 없어요</p>
</section>
</body>
</html>
