<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!-- 상품 상세의 상품문의 영역 (htmx) -->
<section id="inquiries-section" th:fragment="section" class="text-sm">
    <p th:if="${flashMessage != null}" class="mb-3 rounded bg-brand-50 px-3 py-2 text-brand-700" th:text="${flashMessage}"></p>

    <details class="mb-4 rounded-lg border border-gray-200">
        <summary class="cursor-pointer px-4 py-3 font-semibold">문의하기</summary>
        <div class="border-t border-gray-100 p-4">
            <p sec:authorize="isAnonymous()" class="text-gray-500">문의는 <a th:href="@{/login}" class="text-brand-700 underline">로그인</a> 후 남길 수 있어요.</p>
            <form sec:authorize="isAuthenticated()" class="space-y-2"
                  th:attr="hx-post=@{/products/{id}/inquiries(id=${productId})}" hx-target="#inquiries-section" hx-swap="outerHTML">
                <div class="flex flex-wrap gap-2">
                    <label th:each="t, st : ${types}" class="flex items-center gap-1"><input type="radio" name="type" th:value="${t}" th:checked="${st.first}" class="accent-brand-600"> <span th:text="${t.label()}">상품</span></label>
                </div>
                <textarea name="content" rows="3" maxlength="1000" required class="input" placeholder="상품에 대해 궁금한 점을 남겨 주세요 (5자 이상)"></textarea>
                <div class="flex items-center justify-between">
                    <label class="flex items-center gap-1 text-gray-600"><input type="checkbox" name="secret" value="true" class="accent-brand-600"> 비밀글</label>
                    <button class="btn-primary">등록</button>
                </div>
            </form>
        </div>
    </details>

    <ul class="divide-y divide-gray-100">
        <li th:each="q : ${inquiries.content}" class="py-4">
            <p class="flex flex-wrap items-center gap-2 text-xs text-gray-500">
                <span class="badge" th:classappend="${q.answered} ? 'bg-brand-50 text-brand-700' : 'bg-gray-100 text-gray-500'" th:text="${q.answered} ? '답변완료' : '답변대기'"></span>
                <span th:text="'[' + ${q.type.label()} + ']'"></span>
                <span th:text="${names[q.memberId]}">작성자</span>
                <span th:text="${@fmt.date(q.createdAt)}"></span>
                <span th:if="${q.secret}">🔒 비밀글</span>
            </p>
            <th:block th:if="${q.visibleTo(viewerId)}">
                <p class="mt-1.5 whitespace-pre-line" th:text="'Q. ' + ${q.content}">질문</p>
                <p th:if="${q.answered}" class="mt-2 whitespace-pre-line rounded bg-gray-50 p-3 text-gray-700" th:text="(${q.answeredBySeller()} ? '판매자 답변 · ' : '양팡 답변 · ') + ${q.answer}">답변</p>
                <button th:if="${viewerId != null and viewerId == q.memberId and !q.answered}" type="button"
                        th:attr="hx-post=@{/inquiries/{id}/delete(id=${q.id})}" hx-target="#inquiries-section" hx-swap="outerHTML"
                        class="mt-1 text-xs text-gray-400 hover:text-sale">삭제</button>
            </th:block>
            <p th:unless="${q.visibleTo(viewerId)}" class="mt-1.5 text-gray-400">비밀글입니다.</p>
        </li>
    </ul>
    <p th:if="${inquiries.isEmpty()}" class="py-6 text-center text-gray-500">아직 문의가 없어요</p>

    <nav th:if="${inquiries.totalPages > 1}" class="mt-3 flex justify-center gap-1">
        <button type="button" th:each="n : ${#numbers.sequence(1, inquiries.totalPages > 10 ? 10 : inquiries.totalPages)}"
                th:attr="hx-get=@{/products/{id}/inquiries(id=${productId}, page=${n})}" hx-target="#inquiries-section" hx-swap="outerHTML"
                class="min-w-8 rounded px-2 py-1" th:classappend="${n == inquiries.number + 1} ? 'bg-gray-900 text-white' : 'hover:bg-gray-100'"
                th:text="${n}">1</button>
    </nav>
</section>
</body>
</html>
