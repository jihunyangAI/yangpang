<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 입력 전: 최근 검색어 · 인기 검색어 -->
<div th:fragment="empty" class="grid gap-4 p-4 text-sm md:grid-cols-2">
    <div th:if="${loggedIn}">
        <div class="mb-2 flex items-center justify-between">
            <p class="font-bold">최근 검색어</p>
            <button th:if="${!#lists.isEmpty(recent)}" type="button" class="text-xs text-gray-400 hover:text-gray-700"
                    hx-post="/search/recent/clear" hx-target="closest [id^='search-suggest']">전체 삭제</button>
        </div>
        <ul class="space-y-1">
            <li th:each="k : ${recent}" class="flex items-center justify-between">
                <a th:href="@{/search(q=${k})}" class="truncate hover:text-brand-700" th:text="${k}">검색어</a>
                <input type="hidden" name="keyword" th:value="${k}">
                <button type="button" class="px-1 text-gray-300 hover:text-gray-600" aria-label="삭제"
                        hx-post="/search/recent/delete" hx-include="previous input" hx-target="closest [id^='search-suggest']">×</button>
            </li>
        </ul>
        <p th:if="${#lists.isEmpty(recent)}" class="text-xs text-gray-400">최근 검색어가 없어요</p>
    </div>
    <div>
        <p class="mb-2 font-bold">인기 검색어 <span class="text-xs font-normal text-gray-400">최근 7일</span></p>
        <ol class="space-y-1">
            <li th:each="p, st : ${popular}" class="flex items-center gap-2">
                <span class="w-4 text-right font-bold" th:classappend="${st.index < 3} ? 'text-brand-700' : 'text-gray-400'" th:text="${st.count}">1</span>
                <a th:href="@{/search(q=${p.keyword})}" class="truncate hover:text-brand-700" th:text="${p.keyword}">검색어</a>
                <span th:if="${p.rising}" class="text-[10px] font-bold text-sale">급상승</span>
            </li>
        </ol>
        <p th:if="${#lists.isEmpty(popular)}" class="text-xs text-gray-400">아직 집계된 검색어가 없어요</p>
    </div>
</div>

<!-- 입력 중: 상품명 · 카테고리 제안 -->
<div th:fragment="typing" class="py-2 text-sm">
    <a th:each="c : ${categories}" th:href="@{/category/{id}(id=${c.id})}" class="flex items-center gap-2 px-4 py-2 hover:bg-gray-50">
        <span class="badge bg-gray-100 text-gray-500">카테고리</span><span th:text="${c.path}">경로</span></a>
    <a th:each="n : ${names}" th:href="@{/search(q=${n})}" class="block truncate px-4 py-2 hover:bg-gray-50" th:text="${n}">상품명</a>
    <a th:href="@{/search(q=${q})}" class="block px-4 py-2 text-brand-700 hover:bg-gray-50" th:text="'\'' + ${q} + '\' 검색하기'">검색</a>
</div>
</body>
</html>
