<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>전체 카테고리 - YangPang</title></head>
<body>
<main class="container-page flex-1 py-6">
    <h1 class="mb-5 text-2xl font-bold">전체 카테고리</h1>
    <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
        <section th:each="top : ${categoryRoots}" class="card p-5">
            <a th:href="@{/category/{id}(id=${top.id})}" class="mb-3 flex items-center justify-between">
                <h2 class="text-lg font-bold" th:text="${top.name}">대분류</h2>
                <span class="text-sm text-gray-500">전체 ›</span>
            </a>
            <div class="flex flex-wrap gap-2">
                <a th:each="mid : ${top.children}" th:href="@{/category/{id}(id=${mid.id})}" th:text="${mid.name}"
                   class="rounded-full bg-gray-100 px-3.5 py-2 text-sm text-gray-800 hover:bg-brand-50 hover:text-brand-700">중분류</a>
            </div>
        </section>
    </div>
</main>
</body>
</html>
