<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${pageTitle} + ' - YangPang'">목록 - YangPang</title>
</head>
<body>
<main class="flex-1" hx-boost="true">
    <div class="container-page py-5 md:py-8">

        <!-- 브레드크럼 / 제목 -->
        <nav th:if="${!#lists.isEmpty(breadcrumb)}" class="mb-1.5 flex flex-wrap items-center gap-1 text-xs text-gray-500 md:text-[13px]">
            <a th:href="@{/}" class="hover:underline">홈</a>
            <th:block th:each="n : ${breadcrumb}">
                <span>›</span>
                <a th:href="@{/category/{id}(id=${n.id})}" th:text="${n.name}" class="hover:underline">카테고리</a>
            </th:block>
        </nav>
        <div class="mb-4 flex items-baseline gap-2 md:mb-6">
            <h1 class="text-2xl font-bold md:text-[32px]" th:text="${pageTitle}">제목</h1>
            <span class="text-sm text-gray-500" th:text="${#numbers.formatInteger(result.totalElements, 1, 'COMMA')} + '개'">0개</span>
        </div>

        <!-- 하위·형제 카테고리 칩 -->
        <div th:if="${!#lists.isEmpty(chips)}" class="no-scrollbar mb-4 flex gap-2 overflow-x-auto pb-1">
            <a th:each="n : ${chips}" th:href="@{/category/{id}(id=${n.id})}" th:text="${n.name}"
               class="shrink-0 rounded-full px-4 py-2 text-sm ring-1"
               th:classappend="${currentCategory != null and currentCategory.id == n.id}
                     ? 'bg-brand-600 font-bold text-white ring-brand-600'
                     : 'bg-white text-gray-800 ring-gray-200 hover:ring-brand-300'">하위</a>
        </div>

        <div class="md:flex md:gap-8">

            <!-- 필터 (PC 사이드바) -->
            <aside class="card hidden w-60 shrink-0 self-start p-6 md:block" aria-label="필터">
                <div th:replace="~{product/listing :: filters}"></div>
            </aside>

            <section class="min-w-0 flex-1">
                <!-- 필터 (모바일: 접기) -->
                <details class="card mb-4 md:hidden" th:open="${query.hasFilters()}">
                    <summary class="cursor-pointer select-none px-5 py-3.5 text-sm font-bold">
                        필터 <span th:if="${query.hasFilters()}" class="text-brand-700">· 적용 중</span>
                    </summary>
                    <div class="border-t border-gray-100 p-5">
                        <div th:fragment="filters" class="space-y-6 text-sm">
                            <div th:if="${query.hasFilters()}">
                                <a th:href="${query.clearFilters()}" class="text-xs text-gray-500 underline">필터 초기화</a>
                            </div>

                            <div>
                                <p class="mb-2.5 text-[15px] font-bold">배송</p>
                                <a th:each="d : ${deliveryFilters}" th:href="${query.toggleDelivery(d)}"
                                   class="flex items-center gap-2 py-1 hover:text-brand-700">
                                    <span class="flex h-[18px] w-[18px] items-center justify-center rounded-md border text-[11px]"
                                          th:classappend="${query.delivery.contains(d)} ? 'border-brand-600 bg-brand-600 text-white' : 'border-gray-300'"
                                          th:text="${query.delivery.contains(d)} ? '✓' : ''"></span>
                                    <span th:text="${d.label()}">양팡배송</span>
                                </a>
                            </div>

                            <div th:if="${!#lists.isEmpty(brandFacets)}">
                                <p class="mb-2.5 text-[15px] font-bold">브랜드</p>
                                <a th:each="bf : ${brandFacets}" th:href="${query.toggleBrand(bf.brandId)}"
                                   class="flex items-center gap-2 py-1 hover:text-brand-700">
                                    <span class="flex h-[18px] w-[18px] items-center justify-center rounded-md border text-[11px]"
                                          th:classappend="${query.brand.contains(bf.brandId)} ? 'border-brand-600 bg-brand-600 text-white' : 'border-gray-300'"
                                          th:text="${query.brand.contains(bf.brandId)} ? '✓' : ''"></span>
                                    <span th:text="${bf.name}">브랜드</span>
                                    <span class="text-xs text-gray-400" th:text="${bf.count}">0</span>
                                </a>
                            </div>

                            <div>
                                <p class="mb-2.5 text-[15px] font-bold">가격</p>
                                <a th:each="pr : ${priceRanges}"
                                   th:href="${query.isPrice(pr.min, pr.max)} ? ${query.withPrice(null, null)} : ${query.withPrice(pr.min, pr.max)}"
                                   class="block py-1 hover:text-brand-700"
                                   th:classappend="${query.isPrice(pr.min, pr.max)} ? 'font-bold text-brand-700'"
                                   th:text="${pr.label}">가격대</a>
                                <form th:action="${query.basePath}" method="get" class="mt-2 flex items-center gap-1">
                                    <input type="hidden" name="q" th:if="${query.q != null}" th:value="${query.q}">
                                    <input type="hidden" name="categoryId" th:if="${query.categoryId != null and query.basePath == '/search'}" th:value="${query.categoryId}">
                                    <input type="hidden" name="sort" th:value="${#strings.toLowerCase(query.sort.name())}">
                                    <input type="hidden" name="delivery" th:each="d : ${query.delivery}" th:value="${d.name()}">
                                    <input type="hidden" name="brand" th:each="b : ${query.brand}" th:value="${b}">
                                    <input type="hidden" name="rating" th:if="${query.rating != null}" th:value="${query.rating}">
                                    <input type="hidden" name="excludeSoldOut" th:if="${query.excludeSoldOut}" value="true">
                                    <input type="number" name="minPrice" th:value="${query.minPrice}" min="0" step="1000" placeholder="최소"
                                           class="w-full rounded-xl border border-gray-200 bg-white px-2.5 py-2 text-xs">
                                    <span class="text-gray-400">~</span>
                                    <input type="number" name="maxPrice" th:value="${query.maxPrice}" min="0" step="1000" placeholder="최대"
                                           class="w-full rounded-xl border border-gray-200 bg-white px-2.5 py-2 text-xs">
                                    <button type="submit" class="shrink-0 rounded-full bg-gray-900 px-3 py-2 text-xs font-bold text-white">적용</button>
                                </form>
                            </div>

                            <div>
                                <p class="mb-2.5 text-[15px] font-bold">별점</p>
                                <a th:href="${query.toggleRating(4)}" class="flex items-center gap-2 py-1 hover:text-brand-700"
                                   th:classappend="${query.rating == 4} ? 'font-bold text-brand-700'">
                                    <span class="stars"><span style="width:80%"></span></span> 4점 이상
                                </a>
                            </div>

                            <div>
                                <a th:href="${query.toggleSoldOut()}" class="flex items-center gap-2 py-1 hover:text-brand-700">
                                    <span class="flex h-[18px] w-[18px] items-center justify-center rounded-md border text-[11px]"
                                          th:classappend="${query.excludeSoldOut} ? 'border-brand-600 bg-brand-600 text-white' : 'border-gray-300'"
                                          th:text="${query.excludeSoldOut} ? '✓' : ''"></span>
                                    품절 상품 제외
                                </a>
                            </div>
                        </div>
                    </div>
                </details>

                <!-- 정렬 -->
                <div class="no-scrollbar -mx-4 mb-5 flex gap-2 overflow-x-auto px-4 pb-1 text-sm md:mx-0 md:mb-6 md:px-0">
                    <a th:each="s : ${sorts}" th:href="${query.withSort(s)}" th:text="${s.label()}"
                       class="shrink-0 rounded-full px-4 py-2 ring-1"
                       th:classappend="${query.sort == s} ? 'bg-gray-900 font-bold text-white ring-gray-900' : 'bg-white text-gray-800 ring-gray-200 hover:ring-gray-300'">정렬</a>
                </div>

                <!-- 상품 그리드 -->
                <div th:if="${!#lists.isEmpty(cards)}" class="grid grid-cols-2 gap-x-3 gap-y-7 sm:grid-cols-3 md:gap-x-5 md:gap-y-9 lg:grid-cols-4">
                    <th:block th:fragment="items">
                        <th:block th:each="slot : ${slots}">
                            <a th:replace="~{fragments/product-card :: link(${slot.card}, ${slot.href}, ${slot.ad})}"></a>
                        </th:block>
                        <!-- 모바일 무한 스크롤: 화면에 보이면 다음 페이지를 불러와 자기 자리를 바꾼다 -->
                        <div th:if="${result.hasNext()}" class="col-span-full py-6 text-center text-sm text-gray-400 md:hidden"
                             th:attr="hx-get=${query.nextItemsUrl()}" hx-trigger="revealed" hx-swap="outerHTML">
                            불러오는 중...
                        </div>
                    </th:block>
                </div>

                <div th:if="${#lists.isEmpty(cards)}" class="card px-4 py-16 text-center">
                    <svg class="mx-auto h-10 w-10 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    <p class="mt-3 font-serif text-lg font-bold">조건에 맞는 상품이 없어요</p>
                    <p class="mt-1 text-sm text-gray-500">검색어를 바꾸거나 필터를 줄여 보세요.</p>
                    <div th:if="${popular != null and !#lists.isEmpty(popular)}" class="mt-4 flex flex-wrap justify-center gap-2 text-sm">
                        <span class="text-gray-500">인기 검색어</span>
                        <a th:each="p : ${popular}" th:href="@{/search(q=${p.keyword})}" th:text="${p.keyword}"
                           class="rounded-full bg-gray-100 px-3 py-1.5 hover:bg-brand-50 hover:text-brand-700">검색어</a>
                    </div>
                    <a th:if="${query.hasFilters()}" th:href="${query.clearFilters()}" class="btn-outline mt-4">필터 초기화</a>
                </div>

                <!-- 페이지 번호 (PC) -->
                <nav th:if="${result.totalPages > 1}" class="mt-10 hidden items-center justify-center gap-1 text-sm md:flex">
                    <a th:if="${result.hasPrevious()}" th:href="${query.withPage(query.page - 1)}"
                       class="rounded-full px-4 py-2 text-gray-600 hover:bg-white">‹ 이전</a>
                    <a th:each="n : ${pages}" th:href="${query.withPage(n)}" th:text="${n}"
                       class="flex h-10 w-10 items-center justify-center rounded-full"
                       th:classappend="${n == query.page} ? 'bg-brand-600 font-bold text-white' : 'text-gray-700 hover:bg-white'">1</a>
                    <a th:if="${result.hasNext()}" th:href="${query.withPage(query.page + 1)}"
                       class="rounded-full px-4 py-2 text-gray-600 hover:bg-white">다음 ›</a>
                </nav>
            </section>
        </div>
    </div>
</main>
</body>
</html>
