<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>이미지로 찾기 - YangPang</title></head>
<body>
<main class="flex-1">
    <div class="container-page py-6 md:py-8">
        <h1 class="text-xl font-bold md:text-2xl">📷 이미지로 찾기</h1>
        <p class="mt-1 text-sm text-gray-500">사진의 <b>색 분포</b>가 비슷한 상품을 찾아요. 연구용 단순 유사도라 무엇이 찍혔는지는 알아보지 못하고 색만 봐요.
            올린 사진은 저장하지 않아요.</p>

        <div class="mt-4 grid gap-4 md:grid-cols-2">
            <form th:action="@{/search/image}" method="post" enctype="multipart/form-data" class="rounded-3xl bg-white p-5">
                <p class="font-bold">사진 올리기</p>
                <p class="mt-1 text-xs text-gray-500">PNG·JPG·GIF, 5MB까지</p>
                <div class="mt-3 flex flex-wrap items-center gap-2">
                    <input type="file" name="photo" accept="image/png,image/jpeg,image/gif" required class="min-w-0 flex-1 text-sm" aria-label="찾을 사진">
                    <button class="btn-primary h-10 px-5">찾기</button>
                </div>
            </form>
            <div class="rounded-3xl bg-white p-5">
                <p class="font-bold">사진이 없으면 색으로</p>
                <div class="mt-3 flex flex-wrap gap-2">
                    <a th:each="c : ${colors}" th:href="@{/search/image(color=${c.key})}"
                       class="flex items-center gap-1.5 rounded-full border px-3 py-1.5 text-sm hover:border-gray-500"
                       th:classappend="${chosen == c.key} ? 'border-gray-900 font-bold' : 'border-gray-200'">
                        <span class="h-4 w-4 rounded-full border border-gray-300" th:style="'background:' + ${c.value}"></span>
                        <span th:text="${c.key}">블랙</span></a>
                </div>
            </div>
        </div>

        <th:block th:if="${results != null}">
            <div class="mt-6 flex flex-wrap items-center gap-2 text-sm">
                <span class="font-bold" th:text="${uploaded} ? '올린 사진의 주요 색' : '고른 색'">주요 색</span>
                <span th:each="qc : ${queryColors}" class="flex items-center gap-1 rounded-full bg-white px-2.5 py-1">
                    <span class="h-4 w-4 rounded-full border border-gray-300" th:style="'background:' + ${qc.hex}"></span>
                    <span th:text="${qc.name} + '계열 ' + ${qc.percent} + '%'">블랙 40%</span></span>
            </div>
            <p th:if="${#lists.isEmpty(results)}" class="mt-8 rounded-3xl bg-white py-12 text-center text-gray-400">색이 비슷한 상품을 찾지 못했어요</p>
            <div class="mt-4 grid grid-cols-2 gap-x-3 gap-y-6 sm:grid-cols-3 md:grid-cols-5">
                <div th:each="r : ${results}" class="relative">
                    <a th:replace="~{fragments/product-card :: card(${r.card})}"></a>
                    <span class="absolute left-2.5 top-2.5 rounded-full bg-gray-900/80 px-2 py-0.5 text-[11px] font-bold text-white"
                          th:text="'색 ' + ${r.percent} + '% 일치'">80%</span>
                </div>
            </div>
        </th:block>
    </div>
</main>
</body>
</html>
