<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>주문목록 - YangPang</title>
</head>
<body>
<main class="flex-1" hx-boost="true">
    <div class="container-page py-4 md:flex md:gap-10 md:py-8">
        <nav th:replace="~{my/nav :: nav('orders')}"></nav>
        <section class="min-w-0 flex-1">
            <h1 class="mb-4 text-xl font-bold">주문목록</h1>

            <div class="mb-4 space-y-2 text-sm">
                <div class="no-scrollbar flex gap-2 overflow-x-auto">
                    <a th:each="s : ${statusFilters}" th:href="@{/my/orders(period=${period}, status=${s})}" th:text="${s.label}"
                       class="shrink-0 rounded-full border px-3 py-1"
                       th:classappend="${s == status} ? 'border-gray-900 bg-gray-900 text-white' : 'border-gray-300 text-gray-600'">상태</a>
                </div>
                <div class="no-scrollbar flex gap-2 overflow-x-auto">
                    <a th:each="p : ${periods}" th:href="@{/my/orders(period=${p}, status=${status})}" th:text="${p.label}"
                       class="shrink-0 rounded border px-3 py-1 text-xs"
                       th:classappend="${p == period} ? 'border-brand-600 font-bold text-brand-700' : 'border-gray-200 text-gray-500'">기간</a>
                </div>
            </div>

            <div class="space-y-3">
                <th:block th:each="o : ${orders.content}"><div th:replace="~{my/nav :: orderCard(${o})}"></div></th:block>
                <p th:if="${orders.isEmpty()}" class="rounded-lg bg-gray-50 p-10 text-center text-sm text-gray-500">조건에 맞는 주문이 없어요</p>
            </div>

            <nav th:if="${orders.totalPages > 1}" class="mt-6 flex justify-center gap-1 text-sm">
                <a th:each="n : ${#numbers.sequence(1, orders.totalPages)}"
                   th:href="@{/my/orders(period=${period}, status=${status}, page=${n})}" th:text="${n}"
                   class="min-w-8 rounded px-2.5 py-1.5 text-center"
                   th:classappend="${n == orders.number + 1} ? 'bg-brand-600 font-bold text-white' : 'text-gray-600 hover:bg-gray-100'">1</a>
            </nav>
        </section>
    </div>
</main>
</body>
</html>
