<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>신청 상세 - YangPang</title>
</head>
<body>
<main class="flex-1">
    <div class="container-page py-4 md:flex md:gap-10 md:py-8">
        <nav th:replace="~{my/nav :: nav('claims')}"></nav>
        <section class="min-w-0 max-w-2xl flex-1 space-y-4 text-sm" th:with="c=${claim}">
            <div>
                <h1 class="text-xl font-bold" th:text="${c.type.label()} + ' 상세'">상세</h1>
                <p class="mt-1 text-gray-500">신청번호 <span class="font-mono" th:text="${c.claimNo}"></span> ·
                    <span th:text="${@fmt.dateTime(c.requestedAt)}"></span> ·
                    주문 <a th:href="@{/my/orders/{no}(no=${orderNo})}" class="font-mono text-brand-700 underline" th:text="${orderNo}"></a></p>
            </div>

            <div class="rounded-lg border border-gray-200 p-5">
                <p class="text-lg font-bold" th:classappend="${c.status.name() == 'COMPLETED'} ? 'text-gray-900' : 'text-arrival'" th:text="${c.status.label()}">상태</p>
                <ol th:if="${c.type.name() != 'CANCEL' and c.status.name() != 'WITHDRAWN' and c.status.name() != 'REJECTED'}" class="mt-4 grid grid-cols-4 gap-1 text-center text-xs"
                    th:with="order=${ {'REQUESTED','PICKING_UP','PICKED_UP','COMPLETED'} }, cur=${#lists.indexOf(order, c.status.name())}">
                    <li th:each="s, st : ${ {'접수','회수중','회수완료·검수','완료'} }">
                        <div class="h-1.5 rounded-full" th:classappend="${cur >= st.index} ? 'bg-brand-600' : 'bg-gray-200'"></div>
                        <p class="mt-1.5" th:classappend="${cur >= st.index} ? 'font-semibold' : 'text-gray-400'" th:text="${s}">단계</p>
                    </li>
                </ol>
                <div th:if="${c.status.name() == 'REJECTED'}" class="mt-3 rounded-2xl bg-brand-50 p-4 text-brand-800">
                    <p class="font-bold">판매자가 검수 후 신청을 거절했어요</p>
                    <p class="mt-1" th:text="'사유: ' + ${c.rejectReason}">사유</p>
                    <p class="mt-1 text-xs">회수한 상품은 다시 보내드려요. 동의하기 어려우면 고객센터로 문의해 주세요</p>
                </div>
                <p th:if="${c.awaitingSeller()}" class="mt-3 text-xs text-gray-500">판매자가 상품을 검수하고 있어요 (24시간 안에 처리, 늦어지면 자동 승인)</p>
                <form th:if="${c.withdrawable}" th:action="@{/my/claims/{no}/withdraw(no=${c.claimNo})}" method="post" class="mt-4">
                    <button class="btn-outline">신청 철회</button>
                    <span class="ml-2 text-xs text-gray-500">회수가 시작되기 전까지 철회할 수 있어요</span>
                </form>
            </div>

            <div class="rounded-lg border border-gray-200">
                <p class="border-b border-gray-100 px-4 py-3 font-bold">상품</p>
                <ul class="divide-y divide-gray-100">
                    <li th:each="ci : ${c.items}" class="flex items-center gap-3 px-4 py-3">
                        <img th:src="${ci.orderItem.imageUrl}" alt="" class="h-12 w-12 rounded object-cover">
                        <div class="min-w-0 flex-1">
                            <p class="line-clamp-1" th:text="${ci.orderItem.productName}">상품</p>
                            <p class="text-xs text-gray-500" th:text="${(ci.orderItem.optionText ?: '단일 상품') + ' · ' + ci.orderItem.quantity + '개'}"></p>
                            <p th:if="${exchangeTo != null}" class="text-xs font-semibold text-brand-700" th:text="'→ ' + ${exchangeTo} + '(으)로 교환'"></p>
                        </div>
                    </li>
                </ul>
            </div>

            <div class="rounded-lg border border-gray-200 p-4">
                <dl class="space-y-1">
                    <div class="flex justify-between"><dt class="text-gray-500">사유</dt><dd th:text="${c.reason.label()}">사유</dd></div>
                    <div th:if="${c.reasonDetail != null}" class="flex justify-between gap-4"><dt class="shrink-0 text-gray-500">내용</dt><dd class="text-right" th:text="${c.reasonDetail}"></dd></div>
                    <div class="flex justify-between"><dt class="text-gray-500">부담</dt><dd th:text="${c.fault.name() == 'SELLER'} ? '판매자' : '고객'"></dd></div>
                    <div th:if="${c.pickupMethod != null}" class="flex justify-between"><dt class="text-gray-500">회수 방법</dt><dd th:text="${c.pickupMethod.label()}"></dd></div>
                    <div th:if="${c.returnShippingFee > 0}" class="flex justify-between"><dt class="text-gray-500" th:text="${c.type.name() == 'EXCHANGE'} ? '교환 배송비 (모의 결제)' : '반품비 (환불액에서 차감)'"></dt>
                        <dd th:text="${#numbers.formatInteger(c.returnShippingFee, 1, 'COMMA')} + '원'"></dd></div>
                    <div th:if="${c.type.name() != 'EXCHANGE'}" class="flex justify-between border-t border-gray-100 pt-1 font-bold">
                        <dt th:text="${c.status.name() == 'COMPLETED'} ? '환불 금액' : '환불 예정 금액'">환불</dt>
                        <dd th:text="${#numbers.formatInteger(c.refundAmount, 1, 'COMMA')} + '원'">0원</dd></div>
                </dl>
                <p th:each="r : ${refunds}" class="mt-2 text-xs text-arrival"
                   th:text="'✓ ' + ${@fmt.dateTime(r.createdAt)} + ' ' + ${r.method.label()} + '(으)로 ' + ${#numbers.formatInteger(r.amount, 1, 'COMMA')} + '원 환불 완료'"></p>
            </div>
        </section>
    </div>
</main>
</body>
</html>
