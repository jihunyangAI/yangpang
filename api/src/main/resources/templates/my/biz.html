<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>비즈 · 세금계산서 - YangPang</title>
</head>
<body>
<main class="flex-1">
    <div class="container-page py-4 md:flex md:gap-10 md:py-8">
        <nav th:replace="~{my/nav :: nav('biz')}"></nav>
        <section class="min-w-0 flex-1 space-y-4 text-sm">
            <div>
                <h1 class="text-xl font-bold">비즈 · 세금계산서</h1>
                <p class="mt-1 text-xs text-gray-500">사업자 회원가가 있는 상품은 장바구니·주문서에 자동으로 적용돼요.
                    결제한 주문의 상세 화면에서 세금계산서를 요청하면 1시간 안에 발행돼요 (모의 발행, 국세청 전송 없음).</p>
            </div>

            <div th:if="${bizInfo != null}" class="rounded-lg border border-gray-200 p-4 text-xs">
                <p class="mb-1 font-bold">최근 사업자 정보</p>
                <p th:text="${bizInfo.companyName} + ' · 대표 ' + ${bizInfo.ceoName} + ' · ' + ${bizInfo.businessNo} + ' · ' + ${bizInfo.email}">정보</p>
            </div>

            <div th:if="${#lists.isEmpty(invoices)}" class="rounded-lg border border-gray-200 px-4 py-12 text-center text-gray-500">
                아직 요청한 세금계산서가 없어요. <a th:href="@{/my/orders}" class="text-brand-700 underline">주문목록</a>에서 주문을 골라 요청해 보세요.
            </div>
            <table th:unless="${#lists.isEmpty(invoices)}" class="w-full overflow-hidden rounded-lg border border-gray-200 bg-white text-left text-xs">
                <thead class="bg-gray-50 text-gray-500">
                <tr><th class="px-3 py-2">요청일</th><th class="px-3 py-2">주문</th><th class="px-3 py-2">상호</th>
                    <th class="px-3 py-2 text-right">합계</th><th class="px-3 py-2">상태</th></tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                <tr th:each="t : ${invoices}">
                    <td class="px-3 py-2" th:text="${@fmt.date(t.requestedAt)}">날짜</td>
                    <td class="px-3 py-2"><a th:href="@{/my/orders/{no}(no=${orderNos[t.orderId]})}" class="font-mono hover:underline" th:text="${orderNos[t.orderId]}">번호</a></td>
                    <td class="px-3 py-2" th:text="${t.companyName}">상호</td>
                    <td class="px-3 py-2 text-right" th:text="${#numbers.formatInteger(t.amount, 1, 'COMMA')} + '원'">0원</td>
                    <td class="px-3 py-2"><b th:text="${t.status.label()}">요청</b>
                        <span th:if="${t.invoiceNo != null}" class="block font-mono text-gray-400" th:text="${t.invoiceNo}"></span></td>
                </tr>
                </tbody>
            </table>
        </section>
    </div>
</main>
</body>
</html>
