<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>회원정보 - YangPang</title>
</head>
<body>
<main class="flex-1">
    <div class="container-page py-4 md:flex md:gap-10 md:py-8">
        <nav th:replace="~{my/nav :: nav('profile')}"></nav>
        <section class="min-w-0 max-w-lg flex-1 space-y-8 text-sm">
            <div>
                <h1 class="mb-4 text-xl font-bold">회원정보</h1>
                <p class="mb-4 flex items-center justify-between rounded-lg bg-gray-50 px-4 py-3 text-sm">
                    <span><b>성인 인증</b> <span class="text-xs text-gray-500" th:text="${adultVerified} ? '인증됨 (1년 유효, 모의)' : '19세 이상 상품을 보려면 필요해요'"></span></span>
                    <a th:unless="${adultVerified}" th:href="@{/adult-verify(continue='/my/profile')}" class="btn-outline h-8 px-3 text-xs">인증하기</a></p>
                <form th:action="@{/my/profile}" method="post" class="space-y-3">
                    <div><span class="mb-1 block font-semibold">이메일(아이디)</span>
                        <p class="rounded-md bg-gray-50 px-3 py-2.5 text-gray-600" th:text="${member.email}">email</p></div>
                    <div><span class="mb-1 block font-semibold">휴대폰</span>
                        <p class="rounded-md bg-gray-50 px-3 py-2.5 text-gray-600" th:text="${member.phone}">phone</p></div>
                    <label class="block"><span class="mb-1 block font-semibold">이름</span>
                        <input name="name" th:value="${member.name}" class="input" maxlength="20"></label>
                    <label class="flex items-center gap-2">
                        <input type="checkbox" name="marketingAgreed" value="true" th:checked="${member.marketingAgreed}" class="h-4 w-4 accent-brand-600">
                        마케팅 정보 수신 동의
                    </label>
                    <button type="submit" class="btn-primary">저장</button>
                </form>
            </div>

            <div>
                <h2 class="mb-4 text-lg font-bold">비밀번호 변경</h2>
                <form th:action="@{/my/password}" method="post" class="space-y-3">
                    <input type="password" name="currentPassword" placeholder="현재 비밀번호" class="input" autocomplete="current-password" required>
                    <input type="password" name="newPassword" placeholder="새 비밀번호 (영문·숫자·특수문자 8~20자)" class="input" autocomplete="new-password" required>
                    <input type="password" name="newPasswordConfirm" placeholder="새 비밀번호 확인" class="input" autocomplete="new-password" required>
                    <button type="submit" class="btn-outline">비밀번호 변경</button>
                </form>
            </div>
        </section>
    </div>
</main>
</body>
</html>
