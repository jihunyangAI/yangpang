<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>로그인 - YangPang</title>
</head>
<body>
<main class="flex-1 py-10">
    <div class="mx-auto w-full max-w-sm px-4">
        <h1 class="mb-6 text-center text-3xl"><span th:replace="~{fragments/logo :: logo('')}"></span> <span class="align-middle text-xl font-black text-gray-800">로그인</span></h1>

        <div th:if="${param.error}" class="mb-4 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">
            이메일 또는 비밀번호가 맞지 않습니다.
        </div>
        <div th:if="${param.logout}" class="mb-4 rounded-md bg-gray-100 px-3 py-2 text-sm text-gray-700">
            로그아웃되었습니다.
        </div>

        <form th:action="@{/login}" method="post" class="space-y-3 rounded-lg border border-gray-200 bg-white p-5">
            <input type="hidden" name="continue" th:if="${param.continue != null}" th:value="${param.continue}">
            <label class="block">
                <span class="sr-only">이메일</span>
                <input type="email" name="email" required autocomplete="username" placeholder="아이디(이메일)" class="input">
            </label>
            <label class="block">
                <span class="sr-only">비밀번호</span>
                <input type="password" name="password" required autocomplete="current-password" placeholder="비밀번호" class="input">
            </label>
            <label class="flex items-center gap-2 text-sm text-gray-600">
                <input type="checkbox" name="remember" class="h-4 w-4 accent-brand-600"> 자동 로그인
            </label>
            <button type="submit" class="btn-primary w-full py-3 text-base">로그인</button>
            <div class="flex justify-center gap-4 pt-1 text-xs text-gray-500">
                <a th:href="@{/find-account}" class="hover:underline">아이디·비밀번호 찾기</a>
                <a th:href="@{/signup}" class="hover:underline">회원가입</a>
            </div>
        </form>

        <!-- 테스트 계정 빠른 로그인 (기획서 M-08, 연구용 편의 기능) -->
        <section th:if="${showTestLogin}" class="mt-6 rounded-lg border border-dashed border-brand-500 bg-brand-50 p-4">
            <p class="mb-3 text-sm font-bold text-brand-900">테스트 계정으로 바로 로그인</p>
            <div class="space-y-2">
                <form th:each="acc : ${testAccounts}" th:action="@{/login}" method="post">
                    <input type="hidden" name="email" th:value="${acc.email}">
                    <input type="hidden" name="password" th:value="${testPassword}">
                    <input type="hidden" name="continue" th:if="${param.continue != null}" th:value="${param.continue}">
                    <button type="submit" class="flex w-full items-center justify-between rounded-3xl bg-white px-3 py-2 text-left text-sm shadow-sm hover:ring-2 hover:ring-brand-500">
                        <span>
                            <b th:text="${acc.label}">일반 회원</b>
                            <span class="block text-xs text-gray-500" th:text="${acc.email}">email</span>
                        </span>
                        <span class="text-xs text-gray-400" th:text="${acc.description}">설명</span>
                    </button>
                </form>
            </div>
            <p class="mt-3 text-xs text-gray-500">모든 테스트 계정 비밀번호: <code th:text="${testPassword}">pw</code></p>
        </section>
    </div>
</main>
</body>
</html>
